id: step1_design
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Design_Collaboration:
  type: Collaboration
  name: Step 1 - Design
  documentation: >-
    Step 1 of the example study (`../study/example_study.studyflow`): the enrolment and allocation phases of the CONSORT
    participant flow as a complete, runnable fragment, with the study's own element ids and the two phases as the lanes
    the subjects' pool is divided into. The cohort is one artificial actor family, and it is a system of its own, so it
    is a black-box pool and the comprehension check crosses the boundary as a message out and a message back. The
    subjects' pool carries a participant multiplicity of eight, drawn as the three-bar parallel marker at its bottom:
    the eight subjects are eight independent instances of this one process, each drawing its own allocation, and an exit
    inside an instance (Excluded_Pre) ends that instance without ending the study. The counts are zero because nothing
    has run: this is the deposited plan.
  participants:
    Participant_Model:
      type: studyflow:Actor
      name: Language model
      actorType: llm
      implementation: ollama://gemma4:e2b-mlx
    Participant_Design:
      name: Each subject
      participantMultiplicity:
        minimum: 8
        maximum: 8
      processRef: Design
  messageFlows:
    Msg_Screening_Ask:
      name: comprehension check
      sourceRef: Screening
      targetRef: Participant_Model
      messageRef: Request
    Msg_Screening_Answer:
      name: answer
      sourceRef: Participant_Model
      targetRef: Screening
      messageRef: Reply
Request:
  type: Message
  itemRef: Request_Item
Reply:
  type: Message
  itemRef: Reply_Item
Request_Item:
  type: ItemDefinition
  structureRef: agentic:Request
Reply_Item:
  type: ItemDefinition
  structureRef: agentic:Reply
Design:
  type: studyflow:Study
  name: Step 1 - Design
  documentation: >-
    `arm` is a property of this process, so each instance of the pool draws and carries its own allocated disposition;
    the instances do not depend on one another, which is why this is a participant multiplicity and not a loop.
  seed: 42
  authors:
    - Morteza Ansarinia
    - Hoorieh Afkari Roshan
    - Pedro Cardoso-Leite
  version: "1.0"
  properties:
    P_Arm:
      name: arm
      value: none
    P_Instruction:
      name: instruction
      value: none
  laneSets:
    LaneSet_Subject:
      lanes:
        Lane_Enrolment:
          name: Enrolment
          flowNodeRef:
            - Enroll
            - Screening
            - Eligibility_Gateway
            - Excluded_Pre
        Lane_Allocation:
          name: Allocation
          flowNodeRef:
            - Randomize_Disposition
            - Allocate_Cautious
            - Allocate_Impulsive
            - Merge_Allocation
            - Ready_For_Battery
  flowElements:
    Enroll:
      type: StartEvent
      name: Enrolled and consented
      onset: T0
      consentFormUri: https://behaverse.org/protocols/example-study/consent.md
    Screening:
      type: cognitive:Questionnaire
      name: Assessed for eligibility (n={reached})
      documentation: >-
        Asks the actor the comprehension check wired into it and takes the answer as its result; the eligibility gateway
        tests that answer. The exchange is drawn on the step because this figure is about it; in the study file the same
        exchange is one pair of flows on the pool.
      instrument: comprehension-check
      checklist: |-
        - [ ] Consent recorded
        - [ ] Executor configuration pinned (model id, sampling parameters)
        - [ ] Comprehension check passed
      dataInputAssociations:
        In_Check:
          sourceRef:
            - Prompt_Check
      onset: T0
      duration: 10s
    Prompt_Check:
      type: agentic:Prompt
      name: Comprehension check
      template: |
        You are about to take part in a short cognitive study. Each trial arrives as JSON and lists the
        answers the task accepts under ResponseOptions; you answer with exactly one of them and nothing
        else.

        To confirm you have understood, reply now with exactly the single word READY.
    Eligibility_Gateway:
      type: cognitive:EligibilityGateway
      name: Understood the instructions?
      inclusionCriteria:
        - Registered artificial actor family with a pinned model tag
        - Comprehension check answered as instructed
      exclusionCriteria:
        - No answer, or an answer that does not follow the instruction
      default: Flow_Excluded_Pre
    Excluded_Pre:
      type: EndEvent
      name: "Excluded: did not understand the task (n={reached})"
    Randomize_Disposition:
      type: cognitive:RandomGateway
      name: Which disposition? (n={reached})
      documentation: >-
        Allocation is concealed: the draw comes from the study seed and the subject identifier, so it cannot be
        predicted by whoever enrols the subject.
      algorithm: block
      allocationRatio: "1:1"
      default: Flow_Allocate_Impulsive
    Allocate_Cautious:
      type: ServiceTask
      name: Allocated to cautious disposition (n={reached})
      documentation: >-
        The allocation writes the arm's label into the subject's `arm` property and the instruction that arm receives
        into `instruction`; the battery's prompt cites the instruction as `{instruction}`, and the label is what the
        recorded trials and the analysis carry. The implementation is `dict`, so the values a reader sees in the file
        are the values the subject gets.
      dataOutputAssociations:
        Out_Arm_Cautious:
          targetRef: P_Arm
          transformation: result['arm']
        Out_Instruction_Cautious:
          targetRef: P_Instruction
          transformation: result['instruction']
      onset: T0
      duration: 1s
      additionalArguments:
        arm: cautious
        instruction: Take your time on every trial. Answer only when you are sure; accuracy matters more than speed.
      implementation: python://builtins.dict
    Allocate_Impulsive:
      type: ServiceTask
      name: Allocated to impulsive disposition (n={reached})
      dataOutputAssociations:
        Out_Arm_Impulsive:
          targetRef: P_Arm
          transformation: result['arm']
        Out_Instruction_Impulsive:
          targetRef: P_Instruction
          transformation: result['instruction']
      onset: T0
      duration: 1s
      additionalArguments:
        arm: impulsive
        instruction: Go with your first impression on every trial. Answer as fast as you can; speed matters more than accuracy.
      implementation: python://builtins.dict
    Merge_Allocation:
      type: ExclusiveGateway
    Ready_For_Battery:
      type: EndEvent
      name: Ready for the battery
    SF_Start_Screening: Enroll -> Screening
    SF_Screening_Eligibility: Screening -> Eligibility_Gateway
    Flow_Eligible:
      name: yes (n={reached})
      conditionExpression: "'READY' in (Screening or '').upper()"
      sourceRef: Eligibility_Gateway
      targetRef: Randomize_Disposition
    Flow_Excluded_Pre:
      name: no (n={reached})
      sourceRef: Eligibility_Gateway
      targetRef: Excluded_Pre
    Flow_Allocate_Cautious:
      name: cautious (n={reached})
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Cautious
    Flow_Allocate_Impulsive:
      name: impulsive (n={reached})
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Impulsive
    SF_Cautious_Merge: Allocate_Cautious -> Merge_Allocation
    SF_Impulsive_Merge: Allocate_Impulsive -> Merge_Allocation
    SF_Merge_Ready: Merge_Allocation -> Ready_For_Battery
