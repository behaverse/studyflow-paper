id: step1_design
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Design_Collaboration:
  type: Collaboration
  name: Step 1 - Design
  participants:
    Participant_Design:
      name: Example study, Step 1 (Design)
      processRef: Design
      bounds: 160 40 900 740
      isHorizontal: true
Design:
  type: Process
  name: Step 1 - Design
  documentation: >-
    Step 1 of the example study: the enrolment and allocation phases of the CONSORT participant flow as a
    complete, runnable fragment. The two lanes are the CONSORT phases. Every early exit is a boundary error
    event terminating at an error end event that declares a `count` property; the runner increments it as
    subjects leave, and the label cites it as `n={count}`. The random gateway allocates each subject to one of
    the two disposition conditions of Step 2 (cautious or impulsive), which the arm's instruction states.
  extensionElements:
    - type: studyflow:Study
      seed: 42
      runtime: browser
      version: "1.0"
      authors:
        - Morteza Ansarinia
        - Hoorieh Afkari Roshan
        - Pedro Cardoso-Leite
  properties:
    P_arm:
      name: arm
  laneSets:
    LaneSet_Design:
      lanes:
        Lane_Enrolment:
          name: Enrolment
          flowNodeRef: [Enroll, Screening, Eligibility_Gateway, Excluded_Pre]
          bounds: 190 40 870 310
          isHorizontal: true
        Lane_Allocation:
          name: Allocation
          flowNodeRef: [Randomize_Gateway, Allocate_Cautious, DidNotStart_Cautious, Allocate_Impulsive, DidNotStart_Impulsive, Merge_Allocation, Designed, DidNotStart]
          bounds: 190 350 870 430
          isHorizontal: true
  flowElements:
    Enroll:
      type: StartEvent
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Enrolled and consented
      consentFormUri: https://behaverse.org/protocols/example-study/consent.md
      onset: T0
      bounds: 542 70 36 36
      label: 586 81 150 14
    Screening:
      type: Task
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Screening
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: screening
      checklist: |-
        - [ ] Informed consent recorded
        - [ ] Demographic intake
        - [ ] Inclusion criteria checked
        - [ ] Exclusion criteria checked
      onset: T0
      duration: 5min
      bounds: 480 140 160 80
    Eligibility_Gateway:
      type: ExclusiveGateway
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Assessed for eligibility
      extensionElements:
        - type: cognitive:EligibilityGateway
          inclusionCriteria:
            - Aged 18 to 65 years, normal or corrected-to-normal vision (human cohort)
            - Registered agent family with a pinned model version (artificial cohort)
          exclusionCriteria:
            - Prior exposure to the battery
            - Failed comprehension check at screening
      bounds: 535 260 50 50
      isMarkerVisible: true
      label: 380 271 140 27
    Excluded_Pre:
      type: EndEvent
      name: Excluded (n={count})
      properties:
        P_count_pre:
          name: count
          value: "0"
      eventDefinitions:
        ErrorDef_ExcludedPre: { type: ErrorEventDefinition }
      bounds: 862 267 36 36
      fill: "#f1d0cd"
      stroke: "#ac5a54"
    Randomize_Gateway:
      type: ExclusiveGateway
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Randomized
      extensionElements:
        - type: cognitive:RandomGateway
          algorithm: block
          allocationRatio: "1:1"
          blockSize: 4
      documentation: >-
        Allocation is concealed: the draw comes from the study seed and the subject identifier, so it cannot be
        predicted by whoever enrols the subject.
      bounds: 535 390 50 50
      isMarkerVisible: true
      label: 520 448 80 14
    Allocate_Cautious:
      type: Task
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Allocated to cautious disposition (n={reached})
      extensionElements:
        - type: cognitive:Instruction
          content: >-
            Take your time on every trial. Answer only when you are sure; accuracy matters more than speed.
      onset: T0+5min
      duration: 1min
      bounds: 300 490 160 80
    DidNotStart_Cautious:
      type: BoundaryEvent
      name: Did not receive allocated intervention
      eventDefinitions:
        ErrorDef_DidNotStart_Cautious: { type: ErrorEventDefinition }
      attachedToRef: Allocate_Cautious
      bounds: 322 552 36 36
      label: 210 592 120 40
    Allocate_Impulsive:
      type: Task
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Allocated to impulsive disposition (n={reached})
      extensionElements:
        - type: cognitive:Instruction
          content: >-
            Go with your first impression on every trial. Answer as fast as you can; speed matters more than accuracy.
      onset: T0+5min
      duration: 1min
      bounds: 660 490 160 80
    DidNotStart_Impulsive:
      type: BoundaryEvent
      name: Did not receive allocated intervention
      eventDefinitions:
        ErrorDef_DidNotStart_Impulsive: { type: ErrorEventDefinition }
      attachedToRef: Allocate_Impulsive
      bounds: 762 552 36 36
      label: 790 592 120 40
    Merge_Allocation:
      type: ExclusiveGateway
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Begin battery
      bounds: 535 620 50 50
      label: 592 660 90 14
    Designed:
      type: EndEvent
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Ready to run
      bounds: 542 710 36 36
    DidNotStart:
      type: EndEvent
      name: Did not receive allocated intervention (n={count})
      properties:
        P_count_dns:
          name: count
          value: "0"
      eventDefinitions:
        ErrorDef_DidNotStart: { type: ErrorEventDefinition }
      bounds: 862 672 36 36
      fill: "#f1d0cd"
      stroke: "#ac5a54"
    Flow_Enroll_Screening: Enroll -> Screening
    Flow_Screening_Eligibility: Screening -> Eligibility_Gateway
    Flow_Eligible:
      name: eligible
      sourceRef: Eligibility_Gateway
      targetRef: Randomize_Gateway
      label: 568 318 60 14
    Flow_Excluded_Pre:
      name: not eligible
      sourceRef: Eligibility_Gateway
      targetRef: Excluded_Pre
      stroke: "#ac5a54"
    Flow_Allocate_Cautious:
      name: cautious
      sourceRef: Randomize_Gateway
      targetRef: Allocate_Cautious
      waypoint: 535,415 380,415 380,490
      label: 400 397 60 14
    Flow_Allocate_Impulsive:
      name: impulsive
      sourceRef: Randomize_Gateway
      targetRef: Allocate_Impulsive
      waypoint: 585,415 740,415 740,490
      label: 640 397 66 14
    Flow_Cautious_Merge:
      sourceRef: Allocate_Cautious
      targetRef: Merge_Allocation
      waypoint: 380,570 380,645 535,645
    Flow_Impulsive_Merge:
      sourceRef: Allocate_Impulsive
      targetRef: Merge_Allocation
      waypoint: 740,570 740,645 585,645
    Flow_Merge_Designed: Merge_Allocation -> Designed
    Flow_DidNotStart_Cautious:
      sourceRef: DidNotStart_Cautious
      targetRef: DidNotStart
      waypoint: 340,588 340,690 862,690
      stroke: "#ac5a54"
    Flow_DidNotStart_Impulsive:
      sourceRef: DidNotStart_Impulsive
      targetRef: DidNotStart
      waypoint: 780,588 780,690 862,690
      stroke: "#ac5a54"
state:
  _meta:
    reached: { Allocate_Cautious: 0, Allocate_Impulsive: 0 }
  Excluded_Pre: { count: 0 }
  DidNotStart: { count: 0 }
