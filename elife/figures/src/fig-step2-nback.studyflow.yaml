id: step2_nback
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
NBack:
  type: studyflow:Study
  name: The n-back, drawn out and collapsed
  documentation: >-
    The example study's second task at two grains. Above, one trial as an explicit sub-process repeated fifty-six times:
    a stimulus activity reading its timings from a Parameters element, a boundary timer that closes the response window,
    labelled match and non-match branches, and a timer for the inter-stimulus interval. Below, the same two test blocks
    collapsed into the single Behaverse task the study actually wires (`NB` / `XCIT_NB_01`, two test blocks of
    twenty-eight digits, after three tutorial blocks and a practice block the drawing omits), configured by the same
    Parameters element — the `Bot:` block, which is how the build plays for an actor that is not a person and where
    every timing above comes from. The runner expands the collapsed task into the trials drawn above. The durations in
    that block are engine-scaled seconds: the bot runs the engine clock twenty times faster, so the twenty-second
    response window is one real second, which is what a local model needs to answer. The trial sub-process carries a
    standard loop marker, not the parallel multi-instance marker the study's `Subject` carries: an n-back trial is
    answered against the digit before it, so the trials depend on one another and the subjects do not.
  seed: 42
  flowElements:
    A_Start:
      type: StartEvent
      name: Begin block
    Trial:
      type: SubProcess
      name: "Trial (repeated 56 times: two test blocks of 28)"
      loopCharacteristics:
        type: StandardLoopCharacteristics
        loopCondition: state._meta.reached.Trial < 56
        loopMaximum: 56
      flowElements:
        T_Start:
          type: StartEvent
        Present:
          type: Task
          name: Present digit (0.3 s)
          dataInputAssociations:
            In_Params:
              sourceRef:
                - Params_NBack
        Response_Window:
          type: BoundaryEvent
          name: Response window (20 s scaled, 1 s real)
          eventDefinitions:
            Timer_RW:
              type: TimerEventDefinition
              timeDuration: PT20S
          attachedToRef: Present
        Match:
          type: ExclusiveGateway
          name: same digit as the one before?
        Target:
          type: Task
          name: "Match: record hit or miss"
        NonTarget:
          type: Task
          name: "NonMatch: record correct rejection or false alarm"
        Timeout:
          type: Task
          name: Record a missed trial
        Merge:
          type: ExclusiveGateway
        ISI:
          type: IntermediateCatchEvent
          name: Inter-stimulus interval (0.3 s)
          eventDefinitions:
            Timer_ISI:
              type: TimerEventDefinition
              timeDuration: PT0.3S
        T_End:
          type: EndEvent
        TF_1: T_Start -> Present
        TF_2: Present -> Match
        TF_Target:
          name: match
          sourceRef: Match
          targetRef: Target
        TF_NonTarget:
          name: non-match
          sourceRef: Match
          targetRef: NonTarget
        TF_Timeout: Response_Window -> Timeout
        TF_Target_Merge: Target -> Merge
        TF_NonTarget_Merge: NonTarget -> Merge
        TF_Timeout_Merge: Timeout -> Merge
        TF_Merge_ISI: Merge -> ISI
        TF_ISI_End: ISI -> T_End
    A_End:
      type: EndEvent
      name: Block complete
    Params_NBack:
      type: studyflow:Parameters
      name: Task settings (1-back)
      values:
        Bot:
          Speed: 20
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          overrideUserInputParameters: true
          playerPaced: true
          useNonMatchButton: true
          maxResponseTime: 20
          OverrideTemporalParameters: true
          StimulusDisplayDuration: 0.3
          InterStimulusInterval: 0.3
          TrialForeperiod: 0.1
    AF_1: A_Start -> Trial
    AF_2: Trial -> A_End
    B_Start:
      type: StartEvent
      name: Begin battery
    Task_WorkingMemory:
      type: behaverse:Task
      name: Working memory (1-back)
      instrument: NB
      timeline: XCIT_NB_01
      dataInputAssociations:
        In_Pace_WorkingMemory:
          sourceRef:
            - Bot_Pace_NB
      dataOutputAssociations:
        Out_Trials_WorkingMemory:
          targetRef: Dataset_Trials
    Bot_Pace_NB:
      type: studyflow:Parameters
      name: Task settings (1-back)
      documentation: >-
        The whole block the study wires into the task: the stream waits for the actor instead of running on a fixed
        clock, which is what lets a model take it at all, and its stimulus, interval and foreperiod are compressed. It
        defines no block and no timeline; the protocol is the instrument and the timeline alone, and the trials are the
        timeline's own, in order.
      values:
        Bot:
          Speed: 20
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          overrideUserInputParameters: true
          playerPaced: true
          useNonMatchButton: true
          maxResponseTime: 20
          OverrideTemporalParameters: true
          StimulusDisplayDuration: 0.3
          InterStimulusInterval: 0.3
          TrialForeperiod: 0.1
    Dataset_Trials:
      type: behaverse:BDMDataset
      name: Trials
      dataLevel: trials
      uri: data/trials.jsonl
    B_End:
      type: EndEvent
      name: Battery complete
    BF_1: B_Start -> Task_WorkingMemory
    BF_2: Task_WorkingMemory -> B_End
  artifacts:
    Group_A:
      type: Group
      categoryValueRef: CV_A
    Group_B:
      type: Group
      categoryValueRef: CV_B
Category_A:
  type: Category
  categoryValue:
    CV_A:
      value: One trial, drawn out
Category_B:
  type: Category
  categoryValue:
    CV_B:
      value: The same two test blocks, collapsed into the task the study wires
