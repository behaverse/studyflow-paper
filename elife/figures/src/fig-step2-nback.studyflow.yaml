id: step2_nback
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
NBack:
  type: Process
  name: The N-back, drawn out and collapsed
  documentation: >-
    One N-back trial as an explicit subprocess repeated 40 times: a stimulus activity reading its parameters
    from a Parameters element, a boundary timer that closes the response window, labelled target and
    non-target branches, and a timer for the inter-stimulus interval. Below it, the same block collapsed into a
    single Behaverse task configured by the same parameters, wired into it as a Parameters element; the runner
    expands them into trials.
  extensionElements:
    - type: studyflow:Study
      seed: 42
      runtime: browser
  flowElements:
    A_Start:
      type: StartEvent
      fill: "#dcebd6"
      stroke: "#5c8a55"
      name: Begin block
      bounds: 178 187 36 36
    Trial:
      type: SubProcess
      font: "#5c8a55"
      fill: "#f0f6ee"
      stroke: "#5c8a55"
      name: Trial (repeated 40 times)
      loopCharacteristics:
        type: StandardLoopCharacteristics
        loopCondition: state._meta.reached.Trial < 40
        loopMaximum: 40
      bounds: 240 80 720 240
      isExpanded: true
      flowElements:
        T_Start:
          type: StartEvent
          fill: "#dcebd6"
          stroke: "#5c8a55"
          bounds: 258 187 36 36
        Present:
          type: Task
          font: "#5c8a55"
          fill: "#dcebd6"
          stroke: "#5c8a55"
          name: Present letter (500 ms)
          dataInputAssociations:
            In_Params:
              stroke: "#5c8a55"
              sourceRef: [Params_NBack]
              waypoint: 390,145 390,165
          bounds: 320 165 130 80
        Response_Window:
          type: BoundaryEvent
          fill: "#f0f6ee"
          stroke: "#5c8a55"
          name: Response window (3 s)
          eventDefinitions:
            Timer_RW:
              type: TimerEventDefinition
              timeDuration: PT3S
          attachedToRef: Present
          bounds: 422 227 36 36
          label: 300 254 116 27
        Match:
          type: ExclusiveGateway
          fill: "#dcebd6"
          stroke: "#5c8a55"
          name: n-back match?
          bounds: 485 180 50 50
          label: 462 236 96 14
        Target:
          type: Task
          font: "#5c8a55"
          fill: "#dcebd6"
          stroke: "#5c8a55"
          name: "Target: record hit or miss"
          bounds: 610 100 150 55
        NonTarget:
          type: Task
          font: "#5c8a55"
          fill: "#dcebd6"
          stroke: "#5c8a55"
          name: "Non-target: record correct rejection or false alarm"
          bounds: 610 175 150 60
        Timeout:
          type: Task
          font: "#5c8a55"
          fill: "#dcebd6"
          stroke: "#5c8a55"
          name: Record timeout
          bounds: 610 254 150 46
        Merge:
          type: ExclusiveGateway
          fill: "#dcebd6"
          stroke: "#5c8a55"
          bounds: 790 180 50 50
        ISI:
          type: IntermediateCatchEvent
          fill: "#dcebd6"
          stroke: "#5c8a55"
          name: Inter-stimulus interval (1.5 s)
          eventDefinitions:
            Timer_ISI:
              type: TimerEventDefinition
              timeDuration: PT1.5S
          bounds: 860 187 36 36
          label: 820 228 116 27
        T_End:
          type: EndEvent
          fill: "#dcebd6"
          stroke: "#5c8a55"
          bounds: 915 187 36 36
        TF_1:
          sourceRef: T_Start
          targetRef: Present
          stroke: "#5c8a55"
        TF_2:
          sourceRef: Present
          targetRef: Match
          stroke: "#5c8a55"
        TF_Target:
          stroke: "#5c8a55"
          name: target
          sourceRef: Match
          targetRef: Target
          waypoint: 510,180 510,127 610,127
          label: 518 110 44 14
        TF_NonTarget:
          stroke: "#5c8a55"
          name: non-target
          sourceRef: Match
          targetRef: NonTarget
          waypoint: 535,205 610,205
          label: 538 188 70 14
        TF_Timeout:
          stroke: "#5c8a55"
          sourceRef: Response_Window
          targetRef: Timeout
          waypoint: 440,263 440,277 610,277
        TF_Target_Merge:
          stroke: "#5c8a55"
          sourceRef: Target
          targetRef: Merge
          waypoint: 760,127 815,127 815,180
        TF_NonTarget_Merge:
          sourceRef: NonTarget
          targetRef: Merge
          stroke: "#5c8a55"
        TF_Timeout_Merge:
          stroke: "#5c8a55"
          sourceRef: Timeout
          targetRef: Merge
          waypoint: 760,277 815,277 815,230
        TF_Merge_ISI:
          sourceRef: Merge
          targetRef: ISI
          stroke: "#5c8a55"
        TF_ISI_End:
          sourceRef: ISI
          targetRef: T_End
          stroke: "#5c8a55"
    A_End:
      type: EndEvent
      fill: "#dcebd6"
      stroke: "#5c8a55"
      name: Block complete
      bounds: 990 187 36 36
    Params_NBack:
      type: DataObjectReference
      fill: "#f0f6ee"
      stroke: "#5c8a55"
      name: N-back parameters
      extensionElements:
        - type: studyflow:Parameters
          values:
            NValue: 2
            TrialsPerBlock: 40
            StimulusDisplayDuration: 0.5
            MaxResponseTime: 3
            InterStimulusInterval: 1.5
      bounds: 372 95 36 50
      label: 414 108 110 27
    AF_1:
      sourceRef: A_Start
      targetRef: Trial
      stroke: "#5c8a55"
    AF_2:
      sourceRef: Trial
      targetRef: A_End
      stroke: "#5c8a55"
    B_Start:
      type: StartEvent
      fill: "#dcebd6"
      stroke: "#5c8a55"
      name: Begin block
      bounds: 178 432 36 36
    Task_NBack:
      type: ChoreographyTask
      font: "#5c8a55"
      fill: "#dcebd6"
      stroke: "#5c8a55"
      name: Working memory (N-Back)
      extensionElements:
        - type: behaverse:Task
          instrument: NB
      dataInputAssociations:
        In_Params_B:
          stroke: "#5c8a55"
          sourceRef: [Params_NBack_B]
          waypoint: 276,515 276,490
      dataOutputAssociations:
        Out_Trials_B:
          stroke: "#5c8a55"
          targetRef: Dataset_Trials_B
          waypoint: 355,490 355,515
      bounds: 240 410 150 80
    Params_NBack_B:
      type: DataObjectReference
      fill: "#f0f6ee"
      stroke: "#5c8a55"
      name: N-back parameters
      extensionElements:
        - type: studyflow:Parameters
          values:
            Blocks:
              NBack_2:
                Name: NBack_2
                Inherits: Default
                Parameters:
                  NValue: 2
                  Feature: Letters
                  StreamSize: 40
                  StimulusDisplayDuration: 0.5
                  MaxResponseTime: 3
                  InterStimulusInterval: 1.5
            Timelines:
              NBack_2:
                Name: NBack_2
                blocks:
                  - name: NBack_2
      bounds: 258 515 36 50
      label: 165 527 88 27
    Dataset_Trials_B:
      type: DataStoreReference
      fill: "#f0f6ee"
      stroke: "#5c8a55"
      name: Trials (BDM)
      extensionElements:
        - type: behaverse:BDMDataset
          dataLevel: trials
      bounds: 330 515 50 50
    B_End:
      type: EndEvent
      fill: "#dcebd6"
      stroke: "#5c8a55"
      name: Block complete
      bounds: 440 432 36 36
    BF_1:
      sourceRef: B_Start
      targetRef: Task_NBack
      stroke: "#5c8a55"
    BF_2:
      sourceRef: Task_NBack
      targetRef: B_End
      stroke: "#5c8a55"
  artifacts:
    Group_A:
      type: Group
      categoryValueRef: CV_A
      bounds: 160 40 890 310
    Group_B:
      type: Group
      categoryValueRef: CV_B
      bounds: 160 370 890 220
Category_A:
  type: Category
  categoryValue:
    CV_A:
      value: One trial, drawn out
Category_B:
  type: Category
  categoryValue:
    CV_B:
      value: The same block, collapsed into one task
