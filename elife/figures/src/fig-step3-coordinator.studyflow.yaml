id: step3_coordinator
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Coordinate:
  type: studyflow:Study
  name: Step 3 - Analyze, drawn as coordination
  documentation: >-
    An alternative drawing of Step 3 of the example study, not the one the paper prints (`fig-step3-analyze`). There,
    every dataframe call is a box, so nothing is code written for the study and the analysis is nineteen library calls
    under collapsed sub-processes. Here the diagram is the coordination language the Introduction names it (Gelernter
    and Carriero) and nothing else: it keeps the order of the steps, the hand-offs between them, the data contract, the
    feasibility gate and the decision gate of every question, the decision rules those gates read, and the claim state
    each question ends in; the computation inside each step is one call to `analysis.py`, five short functions deposited
    beside the study, each itself one call to a library the study pins. Because the shaping is no longer drawn, each
    question fits in one row and all three can be expanded at once, so a reader sees every gate and every claim state on
    one page. What the drawing gives up is the validator's reach: a column named inside a function is checked only when
    the step runs, so the first step names the columns it reads in its arguments, where the data contract still checks
    them against the trials schema before any data moves.
  seed: 42
  dependencies:
    - pandas==2.3.3
    - scipy==1.16.2
    - scikit-learn==1.7.2
    - matplotlib==3.10.7
  properties:
    trials:
      name: trials
    per_subject:
      name: per_subject
    n_subjects:
      name: n_subjects
    smallest_arm:
      name: smallest_arm
    congruency_test:
      name: congruency_test
    divergence_test:
      name: divergence_test
  flowElements:
    Dataset_Trials:
      type: behaverse:BDMDataset
      name: Trials
      documentation: >-
        One line per recorded event, appended by every task of every subject: the build's own frame (`trialContext`)
        plus the subject and the properties of the scope that played the trial (`context`).
      schema: Trial_Schema
      dataLevel: trials
      uri: data/trials.jsonl
    Trial_Schema:
      type: studyflow:Schema
      name: Trial schema
      documentation: >-
        The columns the analysis reads from the trials dataset, as a CSVW table schema. The first step names the columns
        it reads in its arguments, so `studyflow validate` checks them against this list before any data moves, as it
        does for the drawing the paper prints.
      body:
        "@context": http://www.w3.org/ns/csvw
        tableSchema:
          columns:
            - name: context.subject
              datatype: string
            - name: context.state.arm
              datatype: string
            - name: trialContext.task.id
              datatype: string
            - name: trialContext.block.name
              datatype: string
            - name: trialContext.trial.id
              datatype: string
            - name: trialContext.congruency
              datatype: string
            - name: result.isCorrect
              datatype: boolean
            - name: trialContext.trial.timeInTrial
              datatype: number
    Decision_Rules:
      type: studyflow:Parameters
      name: Decision rules
      documentation: >-
        The thresholds every question's decision reads, fixed before the first run and kept once: the alpha of every
        test; the fewest subjects a within-subject test needs; the fewest subjects per arm a between-arm test needs; the
        equivalence margin on accuracy; the permutations the divergence test draws. Wired into the two questions, so
        every gate reads the same numbers.
      values:
        alpha: 0.05
        min_subjects: 3
        min_per_arm: 4
        margin_low: -0.1
        margin_high: 0.1
        n_permutations: 1000
    An_Start:
      type: StartEvent
    Prepare:
      type: ServiceTask
      name: |-
        One row per trial
        analysis.trials_table
      documentation: >-
        The wire is the read: the dataset's `.jsonl` codec loads the run's event lines with pandas, and the function
        reduces them to one row per answered trial of the test blocks, with the trial keys as columns. The columns it
        reads are named here, in the diagram, so the data contract checks them against the trials schema; so are the
        blocks it keeps.
      dataInputAssociations:
        In_Events:
          sourceRef:
            - Dataset_Trials
          transformation: events
      dataOutputAssociations:
        Out_Trials:
          targetRef: trials
      additionalArguments:
        columns:
          - context.subject
          - context.state.arm
          - trialContext.task.id
          - trialContext.block.name
          - trialContext.trial.id
          - trialContext.congruency
          - result.isCorrect
          - trialContext.trial.timeInTrial
        blocks:
          - Simon
          - XCIT_NB_01_Test_A
          - XCIT_NB_01_Test_B
      implementation: python://analysis.trials_table
    Summarize:
      type: ServiceTask
      name: |-
        Per-subject accuracy
        analysis.per_subject
      documentation: >-
        One row per subject, with its arm and its accuracy in each task; the two counts the feasibility gates read, the
        number of subjects and the size of the smaller arm, are taken from that table on the way out.
      dataInputAssociations:
        In_Trials_PS:
          sourceRef:
            - trials
          transformation: trials
      dataOutputAssociations:
        Out_PS:
          targetRef: per_subject
        Out_N:
          targetRef: n_subjects
          transformation: len(result)
        Out_Smallest_Arm:
          targetRef: smallest_arm
          transformation: result['context.state.arm'].value_counts().min().item() if result['context.state.arm'].nunique() == 2 else 0
      implementation: python://analysis.per_subject
    Congruency:
      type: SubProcess
      name: Congruency effect
      documentation: >-
        Is a subject less accurate on incongruent than on congruent Simon trials? A feasibility gate first, a one-sided
        one-sample t test on each subject's accuracy cost, then the decision against alpha; three claim states.
      dataInputAssociations:
        In_Rules_C:
          sourceRef:
            - Decision_Rules
      flowElements:
        C_Start:
          type: StartEvent
        C_Enough:
          type: ExclusiveGateway
          name: Enough subjects?
          default: C_Enough_Flow
        C_Test:
          type: ServiceTask
          name: |-
            One-sided t test
            analysis.congruency_test
          dataInputAssociations:
            In_Trials_C:
              sourceRef:
                - trials
              transformation: trials
          dataOutputAssociations:
            Out_C:
              targetRef: congruency_test
          implementation: python://analysis.congruency_test
        C_Decision:
          type: ExclusiveGateway
          name: Less accurate when incongruent?
          default: C_No
        C_Supported:
          type: EndEvent
          name: Supported
        C_Not_Supported:
          type: EndEvent
          name: Not supported
        C_Not_Testable:
          type: EndEvent
          name: Not testable
        CF_0: C_Start -> C_Enough
        C_Too_Few:
          name: too few
          conditionExpression: n_subjects < min_subjects
          sourceRef: C_Enough
          targetRef: C_Not_Testable
        C_Enough_Flow:
          name: enough
          sourceRef: C_Enough
          targetRef: C_Test
        CF_2: C_Test -> C_Decision
        C_Yes:
          name: "yes"
          conditionExpression: congruency_test['pvalue'] < alpha
          sourceRef: C_Decision
          targetRef: C_Supported
        C_No:
          name: "no"
          sourceRef: C_Decision
          targetRef: C_Not_Supported
    Divergence:
      type: SubProcess
      name: Divergence between dispositions
      documentation: >-
        Can a classifier tell the two dispositions apart better than chance? Logistic regression on per-subject accuracy
        in each task, scored leave-one-subject-out, against the arm labels shuffled across subjects, the unit that was
        randomized.
      dataInputAssociations:
        In_Rules_D:
          sourceRef:
            - Decision_Rules
      flowElements:
        D_Start:
          type: StartEvent
        D_Enough:
          type: ExclusiveGateway
          name: Enough subjects per arm?
          default: D_Enough_Flow
        D_Test:
          type: ServiceTask
          name: |-
            Classifier against shuffled labels
            analysis.divergence_test
          dataInputAssociations:
            In_PS_D:
              sourceRef:
                - per_subject
              transformation: per_subject
          dataOutputAssociations:
            Out_D:
              targetRef: divergence_test
          additionalArguments:
            n_permutations: "{n_permutations}"
          implementation: python://analysis.divergence_test
        D_Decision:
          type: ExclusiveGateway
          name: Told apart above chance?
          default: D_No
        D_Supported:
          type: EndEvent
          name: Supported
        D_Not_Supported:
          type: EndEvent
          name: Not supported
        D_Not_Testable:
          type: EndEvent
          name: Not testable
        DF_0: D_Start -> D_Enough
        D_Too_Few:
          name: too few
          conditionExpression: smallest_arm < min_per_arm
          sourceRef: D_Enough
          targetRef: D_Not_Testable
        D_Enough_Flow:
          name: enough
          sourceRef: D_Enough
          targetRef: D_Test
        DF_2: D_Test -> D_Decision
        D_Yes:
          name: "yes"
          conditionExpression: divergence_test['pvalue'] < alpha
          sourceRef: D_Decision
          targetRef: D_Supported
        D_No:
          name: "no"
          sourceRef: D_Decision
          targetRef: D_Not_Supported
    Report:
      type: ServiceTask
      name: |-
        Results and figure
        analysis.write_results
      documentation: >-
        The results dataset: the per-subject and group tables, one JSON per question that was tested, and the accuracy
        figure by disposition and congruency, laid out as a Psych-DS dataset.
      dataInputAssociations:
        In_Trials_R:
          sourceRef:
            - trials
          transformation: trials
        In_PS_R:
          sourceRef:
            - per_subject
          transformation: per_subject
        In_C_R:
          sourceRef:
            - congruency_test
          transformation: congruency
        In_D_R:
          sourceRef:
            - divergence_test
          transformation: divergence
      dataOutputAssociations:
        Out_Results:
          targetRef: Dataset_Results
      additionalArguments:
        directory: results/
      implementation: python://analysis.write_results
    Dataset_Results:
      type: studyflow:Dataset
      name: Results
      documentation: The run's results, laid out as a Psych-DS dataset.
      format: psych-ds
      uri: results/
    An_End:
      type: EndEvent
      name: Analyzed
    AF_0: An_Start -> Prepare
    AF_1: Prepare -> Summarize
    AF_2: Summarize -> Congruency
    AF_3: Congruency -> Divergence
    AF_5: Divergence -> Report
    AF_6: Report -> An_End
