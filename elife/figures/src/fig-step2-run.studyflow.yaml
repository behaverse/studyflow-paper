id: step2_run
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Run_Collaboration:
  type: Collaboration
  name: Step 2 - Run
  documentation: >-
    Step 2 of the example study: the follow-up phase, a cognitive battery administered one trial at a time
    through one interface. The runner (top pool) walks the diagram; at every trial it sends a trial to the
    actor and receives a response. Each actor pool is a family of the cohort. The same battery, unchanged,
    is administered to whichever pool takes the study.
  participants:
    Participant_Runner:
      name: Runner (Step 2, Run)
      processRef: Run
      bounds: 160 40 1020 600
      isHorizontal: true
    Participant_Human:
      name: Human participant
      extensionElements:
        - type: studyflow:Actor
          actorType: human
      bounds: 230 680 180 160
      isHorizontal: true
    Participant_Random:
      name: Random baseline
      extensionElements:
        - type: studyflow:Actor
          actorType: software
          implementation: random
      bounds: 423 680 180 160
      isHorizontal: true
    Participant_LLM:
      name: Open-weight LLM
      extensionElements:
        - type: studyflow:Actor
          actorType: llm
          implementation: ollama://llama3.3
      bounds: 616 680 180 160
      isHorizontal: true
    Participant_VLM:
      name: Vision-language model
      extensionElements:
        - type: studyflow:Actor
          actorType: llm
          implementation: claude://claude-opus-4-8
      bounds: 809 680 180 160
      isHorizontal: true
  messageFlows:
    Msg_Obs_Human:
      name: trial
      sourceRef: Battery
      targetRef: Participant_Human
      messageRef: Trial
      waypoint: 290,560 290,680
      label: 250 600 34 14
    Msg_Resp_Human:
      name: response, latency
      sourceRef: Participant_Human
      targetRef: Battery
      messageRef: Response
      waypoint: 350,680 350,560
      label: 356 600 104 14
    Msg_Obs_Random:
      sourceRef: Battery
      targetRef: Participant_Random
      messageRef: Trial
      waypoint: 483,560 483,680
    Msg_Resp_Random:
      sourceRef: Participant_Random
      targetRef: Battery
      messageRef: Response
      waypoint: 543,680 543,560
    Msg_Obs_LLM:
      sourceRef: Battery
      targetRef: Participant_LLM
      messageRef: Trial
      waypoint: 676,560 676,680
    Msg_Resp_LLM:
      sourceRef: Participant_LLM
      targetRef: Battery
      messageRef: Response
      waypoint: 736,680 736,560
    Msg_Obs_VLM:
      sourceRef: Battery
      targetRef: Participant_VLM
      messageRef: Trial
      waypoint: 869,560 869,680
    Msg_Resp_VLM:
      sourceRef: Participant_VLM
      targetRef: Battery
      messageRef: Response
      waypoint: 929,680 929,560
Trial:
  type: Message
  itemRef: Trial_Item
Response:
  type: Message
  itemRef: Response_Item
Trial_Item:
  type: ItemDefinition
  structureRef: behaverse:Trial
Response_Item:
  type: ItemDefinition
  structureRef: behaverse:Response
Run:
  type: Process
  name: Step 2 - Run
  extensionElements:
    - type: studyflow:Study
      seed: 42
      runtime: browser
  properties:
    P_arm:
      name: arm
  flowElements:
    Battery_Start:
      type: StartEvent
      name: Begin battery
      bounds: 200 332 36 36
      label: 194 294 48 27
    Battery:
      type: SubProcess
      name: Cognitive battery (one trial at a time)
      documentation: >-
        Six Behaverse tasks and the jsPsych Flanker, each declaring its instrument and parameters. The
        subprocess declares a `failed_trials` counter in its scope; a task whose failed-trial rate exceeds 20%
        raises its boundary error, which ends the subprocess, and the subprocess's own boundary error routes
        to the counted Discontinued exit.
      properties:
        P_failed_trials:
          name: failed_trials
          value: "0"
      onset: T0+6min
      duration: 30min
      bounds: 260 140 750 420
      isExpanded: true
      flowElements:
        Sub_Start:
          type: StartEvent
          bounds: 280 222 36 36
        Task_NBack:
          type: ChoreographyTask
          name: Working memory (N-Back)
          extensionElements:
            - type: behaverse:Task
              scene: NB
          onset: T0+6min
          duration: 5min
          dataInputAssociations:
            In_Params_NBack:
              sourceRef: [Params_NBack]
              waypoint: 410,110 410,200
          bounds: 340 200 140 80
        Failed_NBack:
          type: BoundaryEvent
          name: "> 20% failed"
          eventDefinitions:
            Err_NBack: { type: ErrorEventDefinition }
          attachedToRef: Task_NBack
          bounds: 450 262 36 36
          label: 488 290 80 14
        Task_DigitSpan:
          type: ChoreographyTask
          name: Verbal span (Digit Span)
          extensionElements:
            - type: behaverse:Task
              scene: DS
          onset: T0+11min
          duration: 4min
          bounds: 510 200 140 80
        Failed_DigitSpan:
          type: BoundaryEvent
          eventDefinitions:
            Err_DS: { type: ErrorEventDefinition }
          attachedToRef: Task_DigitSpan
          bounds: 620 262 36 36
        Task_SART:
          type: ChoreographyTask
          name: Sustained attention (SART)
          extensionElements:
            - type: behaverse:Task
              scene: SART
          onset: T0+15min
          duration: 4min
          bounds: 680 200 140 80
        Failed_SART:
          type: BoundaryEvent
          eventDefinitions:
            Err_SART: { type: ErrorEventDefinition }
          attachedToRef: Task_SART
          bounds: 790 262 36 36
        Task_SRT:
          type: ChoreographyTask
          name: Processing speed (Serial RT)
          extensionElements:
            - type: behaverse:Task
              scene: SRT
          onset: T0+19min
          duration: 4min
          bounds: 850 200 140 80
        Failed_SRT:
          type: BoundaryEvent
          eventDefinitions:
            Err_SRT: { type: ErrorEventDefinition }
          attachedToRef: Task_SRT
          bounds: 960 262 36 36
        Task_Matrices:
          type: ChoreographyTask
          name: Reasoning (Belval Matrices)
          extensionElements:
            - type: behaverse:Task
              scene: BM
          onset: T0+23min
          duration: 5min
          bounds: 850 360 140 80
        Failed_Matrices:
          type: BoundaryEvent
          eventDefinitions:
            Err_BM: { type: ErrorEventDefinition }
          attachedToRef: Task_Matrices
          bounds: 960 422 36 36
        Task_CardSorting:
          type: ChoreographyTask
          name: Set-shifting (Belval Card Sorting)
          extensionElements:
            - type: behaverse:Task
              scene: BCS
          onset: T0+28min
          duration: 4min
          bounds: 680 360 140 80
        Failed_CardSorting:
          type: BoundaryEvent
          eventDefinitions:
            Err_BCS: { type: ErrorEventDefinition }
          attachedToRef: Task_CardSorting
          bounds: 790 422 36 36
        Task_Flanker:
          type: ChoreographyTask
          name: Attention (Flanker, jsPsych)
          extensionElements:
            - type: cognitive:CognitiveTask
              instrument: jspsych
              construct: selective attention
              implementation: https://github.com/jspsych/jspsych-contrib@v0.4.0#flanker
          onset: T0+32min
          duration: 4min
          bounds: 510 360 140 80
        Failed_Flanker:
          type: BoundaryEvent
          eventDefinitions:
            Err_Flanker: { type: ErrorEventDefinition }
          attachedToRef: Task_Flanker
          bounds: 620 422 36 36
        Sub_End:
          type: EndEvent
          name: Battery complete
          bounds: 430 382 36 36
        ErrEnd_Failed:
          type: EndEvent
          name: Failed-trial rate above 20%
          eventDefinitions:
            Err_Battery: { type: ErrorEventDefinition }
          bounds: 280 482 36 36
          fill: "#f1d0cd"
          stroke: "#ac5a54"
          label: 250 522 100 27
        F_Start_NBack: Sub_Start -> Task_NBack
        F_1: Task_NBack -> Task_DigitSpan
        F_2: Task_DigitSpan -> Task_SART
        F_3: Task_SART -> Task_SRT
        F_4:
          sourceRef: Task_SRT
          targetRef: Task_Matrices
          waypoint: 990,240 1000,240 1000,400 990,400
        F_5: Task_Matrices -> Task_CardSorting
        F_6: Task_CardSorting -> Task_Flanker
        F_End: Task_Flanker -> Sub_End
        F_Failed_NBack:
          sourceRef: Failed_NBack
          targetRef: ErrEnd_Failed
          waypoint: 468,298 468,325 298,325 298,482
          stroke: "#ac5a54"
        F_Failed_DS:
          sourceRef: Failed_DigitSpan
          targetRef: ErrEnd_Failed
          waypoint: 638,298 638,325 298,325 298,482
          stroke: "#ac5a54"
        F_Failed_SART:
          sourceRef: Failed_SART
          targetRef: ErrEnd_Failed
          waypoint: 808,298 808,325 298,325 298,482
          stroke: "#ac5a54"
        F_Failed_SRT:
          sourceRef: Failed_SRT
          targetRef: ErrEnd_Failed
          waypoint: 978,298 978,325 298,325 298,482
          stroke: "#ac5a54"
        F_Failed_BM:
          sourceRef: Failed_Matrices
          targetRef: ErrEnd_Failed
          waypoint: 978,458 978,500 316,500
          stroke: "#ac5a54"
        F_Failed_BCS:
          sourceRef: Failed_CardSorting
          targetRef: ErrEnd_Failed
          waypoint: 808,458 808,500 316,500
          stroke: "#ac5a54"
        F_Failed_Flanker:
          sourceRef: Failed_Flanker
          targetRef: ErrEnd_Failed
          waypoint: 638,458 638,500 316,500
          stroke: "#ac5a54"
      dataInputAssociations:
        In_Prompt:
          sourceRef: [Prompt_Trait]
          waypoint: 618,110 618,140
      dataOutputAssociations:
        Out_Trials:
          targetRef: Dataset_Trials
          waypoint: 885,140 885,110
    Params_NBack:
      type: DataObjectReference
      name: N-back parameters
      extensionElements:
        - type: studyflow:Parameters
          values:
            Blocks:
              NBack_2:
                Name: NBack_2
                Inherits: Default
                Parameters:
                  NValue: 2
                  StreamSize: 40
                  InterStimulusInterval: 1.5
            Timelines:
              NBack_2:
                Name: NBack_2
                blocks:
                  - name: NBack_2
      bounds: 392 60 36 50
      label: 434 72 110 27
    Prompt_Trait:
      type: DataObjectReference
      name: Trait prompt
      extensionElements:
        - type: agentic:Prompt
          template: |
            {disposition}

            {stimulus}
            Reply with exactly one of {options}.
      bounds: 600 60 36 50
      label: 642 78 70 14
    Battery_Error:
      type: BoundaryEvent
      name: battery error
      eventDefinitions:
        Err_BatteryExit: { type: ErrorEventDefinition }
      attachedToRef: Battery
      bounds: 985 542 36 36
      label: 940 582 64 14
    Discontinued:
      type: EndEvent
      name: Discontinued intervention (n={count})
      properties:
        P_count_disc:
          name: count
          value: "0"
      eventDefinitions:
        Err_Discontinued: { type: ErrorEventDefinition }
      bounds: 1090 542 36 36
      fill: "#f1d0cd"
      stroke: "#ac5a54"
    Run_End:
      type: EndEvent
      name: Ready for analysis
      bounds: 1090 332 36 36
    Dataset_Trials:
      type: DataStoreReference
      name: Trials (BDM)
      extensionElements:
        - type: behaverse:BDMDataset
          dataLevel: trials
          uri: data/trials/
      bounds: 860 60 50 50
      label: 784 72 70 27
    Schema_Trials:
      type: DataObjectReference
      name: Trial schema (CSVW)
      extensionElements:
        - type: studyflow:Schema
          format: csvw
          body: |
            columns:
              - name: subject_id
              - name: task
              - name: trial_index
              - name: stimulus
              - name: response
              - name: response_time
                datatype: number
              - name: correct
                datatype: boolean
              - name: failure_mode
      bounds: 1000 60 36 50
      label: 1042 66 110 27
    Flow_Start_Battery: Battery_Start -> Battery
    Flow_Battery_End:
      sourceRef: Battery
      targetRef: Run_End
      waypoint: 1010,350 1090,350
    Flow_Error_Discontinued:
      sourceRef: Battery_Error
      targetRef: Discontinued
      stroke: "#ac5a54"
      waypoint: 1021,560 1090,560
  artifacts:
    Assoc_Schema_Trials:
      associationDirection: One
      sourceRef: Schema_Trials
      targetRef: Dataset_Trials
      waypoint: 1000,85 910,85
state:
  Discontinued: { count: 0 }
