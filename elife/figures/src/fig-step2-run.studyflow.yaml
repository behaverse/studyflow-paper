id: step2_run
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Run_Collaboration:
  type: Collaboration
  name: Step 2 - Run
  documentation: >-
    Step 2 of the example study (`../study/example_study.studyflow`): the follow-up phase, two cognitive tasks from the
    Behaverse build administered one trial at a time, with the study's own element ids. The cohort is one artificial
    actor family, a language model served by a local Ollama. A pool is the boundary of a system: the tasks run in the
    study's system, the model is another, and the only thing crossing the boundary is the exchange drawn here — one
    `behaverse:Trial` out per trial and one `behaverse:Response` back, per task. @fig-combined folds the same four flows
    into one pair at the pool level, which every task inside inherits. The shared `agentic:Prompt` carries the task
    rules and cites the instruction the subject was allocated as `{instruction}`, so the same battery, unchanged, is
    administered to whichever arm the subject was drawn into. Each task reads its protocol, wired in beside it in the
    subjects' pool, which states the values of its blocks for a person. The two task settings, drawn in the model's
    pool, are not the protocol: they are how the build plays for an actor that is not a person and where it departs from
    the protocol (its own clock, and 30 s to answer every trial), and each task needs its own, since a Parameters object
    only reaches a step it is wired into. The attrition rule is a conditional boundary event reading the task's own
    missed-trial rate, not an attribute of the task: above the subject's `max_unanswered`, one in five, the subject
    leaves at Discontinued, and the exits' labels cite that property rather than repeat its value. The counts are zero
    because nothing has run: this is the deposited plan.
  participants:
    Participant_Model:
      type: studyflow:Actor
      name: Language model
      actorType: llm
      implementation: ollama://gemma4:e2b-mlx
    Participant_Runner:
      name: Study protocol, Step 2 (Run)
      processRef: Run
  messageFlows:
    Msg_Interference_Trial:
      name: each trial
      sourceRef: Task_Interference
      targetRef: Participant_Model
      messageRef: Trial
    Msg_Interference_Response:
      name: each response
      sourceRef: Participant_Model
      targetRef: Task_Interference
      messageRef: Response
    Msg_WorkingMemory_Trial:
      name: each trial
      sourceRef: Task_WorkingMemory
      targetRef: Participant_Model
      messageRef: Trial
    Msg_WorkingMemory_Response:
      name: each response
      sourceRef: Participant_Model
      targetRef: Task_WorkingMemory
      messageRef: Response
Trial:
  type: Message
  itemRef: Trial_Item
Response:
  type: Message
  itemRef: Response_Item
Trial_Item:
  type: ItemDefinition
  structureRef: behaverse:Trial
Response_Item:
  type: ItemDefinition
  structureRef: behaverse:Response
Run:
  type: studyflow:Study
  name: Step 2 - Run
  seed: 42
  version: "1.0"
  properties:
    P_MaxUnanswered:
      name: max_unanswered
      value: 0.2
    P_Arm:
      name: arm
      value: none
    P_Instruction:
      name: instruction
      value: none
  flowElements:
    Battery_Start:
      type: StartEvent
      name: Allocated, battery begins
    Simon_Timeline:
      type: studyflow:Parameters
      name: Simon protocol
      documentation: >-
        The protocol of the Simon task, written out at the values the build ships, so that the file rather than the
        build states them. One block of 30 trials and no practice. A trial: 1 s from its start to the disk, which shows
        for 1 s or until the answer; 5 s to answer; a tick or a cross after every answer; 0.5 s before the next trial.
        The disk has the colour of the correct button; its congruency (congruent, over the correct button; incongruent,
        over the other; neutral, centred) and the correct button are each drawn per trial, uniformly and with
        replacement, by the build's generator, whose seed is drawn when the task starts and recorded with every trial.
        The build merges these Parameters over its own definition of the timeline.
      values:
        Timelines:
          SimonTask:
            Blocks:
              - Name: Simon
                ExitRules:
                  - Trials: 30
                Parameters:
                  PrimaryFeature: Color
                  SecondaryFeature: Position
                  ButtonCount: 2
                  ButtonSymbols: Disk
                  ButtonColors:
                    - "#FFC826"
                    - "#2D50C8"
                  NeutralSymbol: Disk
                  NeutralColor: "#FFFFFF"
                  ShowButtonContent: true
                  InputDevice: MouseOrTouch
                  ResponseButtonKeys:
                    - LeftArrow
                    - RightArrow
                  Congruency:
                    Distribution:
                      Type: Uniform
                  CorrectButton:
                    Distribution:
                      Type: Uniform
                  TaskPace: PlayerDriven
                  FixationPointDisplayDuration: 0
                  StimulusOnset: 1
                  StimulusDisplayDuration: 1
                  MaxResponseTime: 5
                  ShowAccuracyCheckFeedback: Always
                  ShowCorrectTrialResponseFeedback: Never
                  InterTrialInterval: 0.5
    Bot_Pace_Simon:
      type: studyflow:Parameters
      name: Task settings (Simon)
      documentation: >-
        Not the protocol: how the build plays the Simon task for an actor that is not a person, and where it departs
        from the protocol. It skips the screens nobody is there to click and keeps the engine clock at the protocol's
        own pace (`Speed: 1`). Every trial gives the actor 30 s to answer instead of the protocol's 5 s, so that a model
        slower than a person still answers in time: the block repeats one trial that carries this window, and the
        protocol's exit rule still ends it after 30. The window reaches the actor with each trial, and the runner waits
        for the answer as long. A Parameters object only reaches a step it is wired into, so each task carries its own.
      values:
        Bot:
          Speed: 1
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
        Blocks:
          Simon:
            RepeatTrials: true
            Trials:
              - Parameters:
                  MaxResponseTime: 30
    Prompt_Battery:
      type: agentic:Prompt
      name: Battery prompt
      template: |
        {instruction}

        You are taking a computerised cognitive test one trial at a time. Each message is one trial, as
        JSON. Your answer is one of the strings in that trial's own ResponseOptions, copied exactly and
        with nothing else; any other word is a lost trial. Read ResponseOptions first, and answer from
        it. The two tests below alternate, and ResponseOptions is what tells you which one you are on.

        ResponseOptions ["Left", "Right"]: the trial draws two buttons, each with a symbol, a colour and
        a position. Answer with the position of the button whose symbol and colour match the neutral
        reference, NeutralSymbol and NeutralColor, wherever that button happens to sit.

        ResponseOptions ["Match", "NonMatch"]: the trial shows one digit. Answer Match if it is the same
        digit as the one on the trial before, and NonMatch otherwise.
    NBack_Protocol:
      type: studyflow:Parameters
      name: 1-back protocol
      documentation: >-
        The protocol of the 1-back's practice and test blocks on the build's `XCIT_NB_01` timeline, written out at the
        values the build ships, so that the file rather than the build states them; the three tutorial blocks before
        them run as the build ships them. Digits 1 to 9, one at a time; the first digit of a block has none before it
        and takes no answer. The practice block's 14 digits are drawn by the build's 1-back generator with the numbers
        of matches and lures stated here; the test blocks' 28 digits come in the fixed orders below, 9 matches in each.
        A digit shows for 0.5 s and the next follows 2.2 s later, whether or not an answer came, so the window to answer
        is 2.7 s. The practice block marks every answer and shows the right one after a miss; the test blocks show
        nothing. The build merges these Parameters over its own definitions of the blocks.
      values:
        Blocks:
          XCIT_NB_01_Practice:
            Parameters:
              NValue: 1
              Feature: Digits
              FeatureValuesCount: 9
              StreamSize: 14
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: NBack
                      NValue:
                        Reference: NValue
                      StreamSize:
                        Reference: StreamSize
                      FeatureValuesCount:
                        Reference: FeatureValuesCount
                      MatchCount: 6
                      PostLureCount: 5
                      PreLureCount: 5
              UseNonMatchButton: true
              PlayerPaced: false
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 2.2
              TrialForeperiod: 0
              ShowAccuracyFeedback: true
              ShowCorrectTrialResponseFeedback: OnTimeout
          XCIT_NB_01_Test_A:
            Parameters:
              NValue: 1
              Feature: Digits
              FeatureValuesCount: 9
              StreamSize: 28
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values:
                        - 5
                        - 5
                        - 2
                        - 5
                        - 5
                        - 9
                        - 7
                        - 7
                        - 7
                        - 8
                        - 3
                        - 8
                        - 4
                        - 4
                        - 3
                        - 4
                        - 3
                        - 2
                        - 2
                        - 6
                        - 6
                        - 9
                        - 9
                        - 8
                        - 1
                        - 6
                        - 1
                        - 1
              UseNonMatchButton: true
              PlayerPaced: false
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 2.2
              TrialForeperiod: 0
              ShowAccuracyFeedback: false
              ShowCorrectTrialResponseFeedback: Never
          XCIT_NB_01_Test_B:
            Parameters:
              NValue: 1
              Feature: Digits
              FeatureValuesCount: 9
              StreamSize: 28
              Streams:
                - Feature:
                    Reference: Feature
                  StimulusValue:
                    Generate: OncePerBlock
                    Sequence:
                      Type: Ordered
                      Values:
                        - 4
                        - 5
                        - 4
                        - 4
                        - 9
                        - 3
                        - 3
                        - 3
                        - 1
                        - 1
                        - 4
                        - 1
                        - 2
                        - 9
                        - 9
                        - 5
                        - 6
                        - 5
                        - 6
                        - 6
                        - 7
                        - 7
                        - 8
                        - 8
                        - 8
                        - 2
                        - 7
                        - 2
              UseNonMatchButton: true
              PlayerPaced: false
              StimulusDisplayDuration: 0.5
              InterStimulusInterval: 2.2
              TrialForeperiod: 0
              ShowAccuracyFeedback: false
              ShowCorrectTrialResponseFeedback: Never
    Bot_Pace_NB:
      type: studyflow:Parameters
      name: Task settings (1-back)
      documentation: >-
        Not the protocol: how the build plays the 1-back for an actor that is not a person, and where it departs from
        the protocol. It skips the screens nobody is there to click and keeps the engine clock at the protocol's own
        pace (`Speed: 1`). The stream waits for each answer, up to 30 s, instead of moving on every 2.7 s, which is what
        lets a model take it at all; the window reaches the actor with each trial, and the runner waits for the answer
        as long. The foreperiod and the digit's move take 0.1 s. The build marks a 1-back answer right or wrong only in
        a block that shows accuracy feedback, which the test blocks do not, so the bot shows it in every block; an actor
        that reads the trial as text sees none of it.
      values:
        Bot:
          Speed: 1
          SkipInstructions: true
          AutoClickInstructions: true
          SkipFocusArea: true
          overrideUserInputParameters: true
          playerPaced: true
          useNonMatchButton: true
          maxResponseTime: 30
          OverrideTemporalParameters: true
          TrialForeperiod: 0.1
          stimulusMovingAnimationDuration: 0.1
          overrideFeedbackParameters: true
          showAccuracyOnButtonFeedback: true
    Task_Interference:
      type: behaverse:Task
      name: Interference control (Simon)
      documentation: >-
        The Simon task the Behaverse build ships as WO / SimonTask, congruency (congruent, incongruent, neutral) drawn
        per trial, so the congruency contrast is inside one block of 30 trials. The Simon protocol wired into it states
        every value of the block, and the task settings how the build plays for the actor.
      instrument: WO
      timeline: SimonTask
      onset: T0+20s
      duration: 40s
      dataInputAssociations:
        In_Timeline_Interference:
          sourceRef:
            - Simon_Timeline
        In_Pace_Interference:
          sourceRef:
            - Bot_Pace_Simon
        In_Prompt_Interference:
          sourceRef:
            - Prompt_Battery
      dataOutputAssociations:
        Out_Trials_Interference:
          targetRef: Dataset_Trials
    Failed_Interference:
      type: BoundaryEvent
      name: "> {max_unanswered:%} unanswered"
      eventDefinitions:
        Cond_Interference:
          type: ConditionalEventDefinition
          condition: "{Task_Interference.failedTrialRate} > max_unanswered"
      attachedToRef: Task_Interference
    Task_WorkingMemory:
      type: behaverse:Task
      name: Working memory (1-back)
      documentation: >-
        The 1-back the build ships as NB / XCIT_NB_01, the timeline its human studies run: three tutorial blocks and a
        practice block, then two test blocks of 28 digits. Every block runs; the analysis keeps the test blocks. The
        1-back protocol wired into it states the practice and test blocks; the tutorials run as the build ships them.
      instrument: NB
      timeline: XCIT_NB_01
      onset: T0+60s
      duration: 3min
      dataInputAssociations:
        In_Prompt_WorkingMemory:
          sourceRef:
            - Prompt_Battery
        In_Protocol_WorkingMemory:
          sourceRef:
            - NBack_Protocol
        In_Pace_WorkingMemory:
          sourceRef:
            - Bot_Pace_NB
      dataOutputAssociations:
        Out_Trials_WorkingMemory:
          targetRef: Dataset_Trials
    Failed_WorkingMemory:
      type: BoundaryEvent
      name: "> {max_unanswered:%} unanswered"
      eventDefinitions:
        Cond_WorkingMemory:
          type: ConditionalEventDefinition
          condition: "{Task_WorkingMemory.failedTrialRate} > max_unanswered"
      attachedToRef: Task_WorkingMemory
    Discontinued:
      type: EndEvent
      name: "Discontinued: more than {max_unanswered:%} of trials unanswered (n={reached})"
    Dataset_Trials:
      type: behaverse:BDMDataset
      name: Trials
      documentation: >-
        One line per recorded event, appended by both tasks of every subject: the build's own frame (`trialContext`)
        plus the subject and the properties of the scope that played the trial (`context`).
      dataLevel: trials
      uri: data/trials.jsonl
    Run_End:
      type: EndEvent
      name: Ready for analysis
    Flow_Start_Interference: Battery_Start -> Task_Interference
    SF_Interference_WorkingMemory: Task_Interference -> Task_WorkingMemory
    SF_WorkingMemory_End: Task_WorkingMemory -> Run_End
    SF_Failed_Interference: Failed_Interference -> Discontinued
    SF_Failed_WorkingMemory: Failed_WorkingMemory -> Discontinued
