id: step3_decision
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Decide:
  type: studyflow:Study
  name: Step 3 - A question decided
  documentation: >-
    One of the two questions of the example study's analysis (`../study/example_study.studyflow`), its `Congruency`
    sub-process expanded and otherwise unchanged: the same element ids and arguments. The data shaping stays collapsed;
    what is drawn is the decision. A feasibility gateway sends a cohort too small for the test to the Not testable end;
    otherwise the one-sided t test runs and the decision gateway compares its p value with the alpha of the decision
    rules, ending at Supported or Not supported. Every number the two gateways read sits in the Decision rules object,
    wired in once; the executed copy records which end was reached.
  seed: 42
  dependencies:
    - pandas==2.3.3
    - scipy==1.16.2
  properties:
    trials:
      name: trials
  flowElements:
    Decision_Rules:
      type: studyflow:Parameters
      name: Decision rules
      documentation: >-
        The thresholds every question's decision reads, fixed before the first run and kept once: the alpha of every
        test; the fewest subjects a within-subject test needs; the fewest subjects per arm a between-arm test needs,
        four being the smallest arms for which shuffling labels across subjects can reach p < .05; the permutations the
        divergence test draws.
      values:
        alpha: 0.05
        min_subjects: 3
        min_per_arm: 4
        n_permutations: 1000
    Congruency:
      type: SubProcess
      name: Congruency effect
      properties:
        by_congruency:
          name: by_congruency
        accuracy_congruent:
          name: accuracy_congruent
        accuracy_incongruent:
          name: accuracy_incongruent
        congruency_costs:
          name: congruency_costs
        congruency_n:
          name: congruency_n
        congruency_test:
          name: congruency_test
      dataInputAssociations:
        In_Rules_C:
          sourceRef:
            - Decision_Rules
      flowElements:
        C_Start:
          type: StartEvent
        Cost_Per_Subject:
          type: SubProcess
          name: Accuracy cost per subject
          documentation: >-
            The descriptive table by disposition and congruency, written out as it stands; then, per subject, the mean
            accuracy on congruent trials minus the mean on incongruent ones, and how many subjects have both.
          flowElements:
            CP_Start:
              type: StartEvent
            Congruency_Table:
              type: ServiceTask
              name: Accuracy and latency by congruency
              dataInputAssociations:
                In_Trials_C:
                  sourceRef:
                    - trials
                  transformation: self
              dataOutputAssociations:
                Out_Congruency:
                  targetRef: File_Congruency
              additionalArguments:
                index:
                  - context.state.arm
                  - trialContext.congruency
                values:
                  - result.isCorrect
                  - trialContext.trial.timeInTrial
                aggfunc: mean
              implementation: python://pandas.DataFrame.pivot_table
            By_Congruency:
              type: ServiceTask
              name: Accuracy, one column per congruency
              dataInputAssociations:
                In_Trials_BC:
                  sourceRef:
                    - trials
                  transformation: self
              dataOutputAssociations:
                Out_BC:
                  targetRef: by_congruency
              additionalArguments:
                index: context.subject
                columns: trialContext.congruency
                values: result.isCorrect
                aggfunc: mean
              implementation: python://pandas.DataFrame.pivot_table
            Accuracy_Incongruent:
              type: ServiceTask
              name: Incongruent accuracies
              dataInputAssociations:
                In_BC_I:
                  sourceRef:
                    - by_congruency
                  transformation: self
              dataOutputAssociations:
                Out_Incongruent:
                  targetRef: accuracy_incongruent
              additionalArguments:
                key: Incongruent
              implementation: python://pandas.DataFrame.get
            Accuracy_Congruent:
              type: ServiceTask
              name: Congruent accuracies
              dataInputAssociations:
                In_BC_C:
                  sourceRef:
                    - by_congruency
                  transformation: self
              dataOutputAssociations:
                Out_Congruent:
                  targetRef: accuracy_congruent
              additionalArguments:
                key: Congruent
              implementation: python://pandas.DataFrame.get
            Cost:
              type: ServiceTask
              name: Congruency cost per subject
              dataInputAssociations:
                In_Cost_C:
                  sourceRef:
                    - accuracy_congruent
                  transformation: self
                In_Cost_I:
                  sourceRef:
                    - accuracy_incongruent
                  transformation: other
              dataOutputAssociations:
                Out_Costs:
                  targetRef: congruency_costs
                Out_Cost_N:
                  targetRef: congruency_n
                  transformation: result.count().item()
              implementation: python://pandas.Series.sub
            File_Congruency:
              type: DataObjectReference
              name: Congruency table
              uri: results/congruency.csv
            CP_End:
              type: EndEvent
            CPF_0: CP_Start -> Congruency_Table
            CPF_1: Congruency_Table -> By_Congruency
            CPF_2: By_Congruency -> Accuracy_Congruent
            CPF_3: Accuracy_Congruent -> Accuracy_Incongruent
            CPF_4: Accuracy_Incongruent -> Cost
            CPF_5: Cost -> CP_End
        Enough_Subjects:
          type: ExclusiveGateway
          name: Enough subjects?
          default: C_Enough
        Cost_Test:
          type: ServiceTask
          name: One-sided t test
          dataInputAssociations:
            In_Costs:
              sourceRef:
                - congruency_costs
              transformation: a
          dataOutputAssociations:
            Out_Cost_Test:
              targetRef: congruency_test
              transformation: "{'statistic': result.statistic, 'pvalue': result.pvalue}"
          additionalArguments:
            popmean: 0
            alternative: greater
            nan_policy: omit
          implementation: python://scipy.stats.ttest_1samp
        Congruency_Decision:
          type: ExclusiveGateway
          name: Less accurate when incongruent?
          default: C_No
        C_Supported:
          type: EndEvent
          name: Supported
        C_Not_Supported:
          type: EndEvent
          name: Not supported
        C_Not_Testable:
          type: EndEvent
          name: Not testable
        CF_0: C_Start -> Cost_Per_Subject
        CF_1: Cost_Per_Subject -> Enough_Subjects
        C_Too_Few:
          name: too few
          conditionExpression: congruency_n < min_subjects
          sourceRef: Enough_Subjects
          targetRef: C_Not_Testable
        C_Enough:
          name: enough
          sourceRef: Enough_Subjects
          targetRef: Cost_Test
        CF_2: Cost_Test -> Congruency_Decision
        C_Yes:
          name: "yes"
          conditionExpression: congruency_test['pvalue'] < alpha
          sourceRef: Congruency_Decision
          targetRef: C_Supported
        C_No:
          name: "no"
          sourceRef: Congruency_Decision
          targetRef: C_Not_Supported
