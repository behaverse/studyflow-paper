id: step3_decision
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Decide:
  type: studyflow:Study
  name: Step 3 - A question decided
  documentation: >-
    One of the two questions of the example study's analysis (`../study/example_study.studyflow`), its `Congruency`
    sub-process expanded and otherwise unchanged: the same element ids and arguments. The descriptive table is written
    out first; then a feasibility gateway sends a cohort too small for the test to the Not testable end; otherwise the
    one-sided paired t test, one library call on the trials, runs and the decision gateway compares its p value with the
    alpha of the decision rules, ending at Supported or Not supported. Every number the two gateways read sits in the
    Decision rules object, wired in once, or is the count of analysed subjects; the executed copy records which end was
    reached.
  seed: 42
  dependencies:
    - pandas==2.3.3
    - scipy==1.16.2
    - pingouin==0.7.0
  properties:
    analysed_trials:
      name: analysed_trials
    analysed_subjects:
      name: analysed_subjects
  flowElements:
    Decision_Rules:
      type: studyflow:Parameters
      name: Decision rules
      documentation: >-
        The thresholds every question's decision reads, fixed before the first run and kept once: the alpha of every
        test; the fewest subjects a within-subject test needs; the fewest subjects per arm a between-arm test needs,
        four being the smallest arms for which shuffling labels across subjects can reach p < .05; the permutations the
        difference test draws.
      values:
        alpha: 0.05
        min_subjects: 3
        min_per_arm: 4
        n_permutations: 1000
    Congruency:
      type: SubProcess
      name: Congruency effect
      documentation: >-
        Is a subject less accurate on incongruent than on congruent Simon trials? The descriptive table by instruction
        condition and congruency is written out first, either way. Then one call does the test: per subject, the mean
        accuracy on congruent trials and the mean on incongruent ones, compared by a one-sided paired t test in the
        predicted direction; trials with no congruency, the 1-back's, take no part. The decision was fixed before the
        first run: not testable with fewer analysed subjects than the decision rules' minimum, supported when p is below
        their alpha, not supported otherwise.
      properties:
        congruency_test:
          name: congruency_test
      dataInputAssociations:
        In_Rules_C:
          sourceRef:
            - Decision_Rules
      flowElements:
        C_Start:
          type: StartEvent
        Congruency_Table:
          type: ServiceTask
          name: Accuracy by congruency
          dataInputAssociations:
            In_Trials_C:
              sourceRef:
                - analysed_trials
              transformation: self
          dataOutputAssociations:
            Out_Congruency:
              targetRef: File_Congruency
          additionalArguments:
            index:
              - context.state.arm
              - trialContext.congruency
            values:
              - result.isCorrect
            aggfunc: mean
          implementation: python://pandas.DataFrame.pivot_table
        File_Congruency:
          type: DataObjectReference
          name: Congruency table
          uri: results/congruency.csv
        Enough_Subjects:
          type: ExclusiveGateway
          name: Enough subjects?
          default: C_Enough
        Cost_Test:
          type: ServiceTask
          name: One-sided paired t test
          documentation: >-
            Averages each subject's trials within each congruency, then tests congruent against incongruent across
            subjects, one-sided; the same t as the congruent-minus-incongruent cost tested against zero. The Simon task
            also has neutral trials, a third level; the decision reads the first row only, Congruent against
            Incongruent.
          dataInputAssociations:
            In_Trials_Test:
              sourceRef:
                - analysed_trials
              transformation: data
          dataOutputAssociations:
            Out_Cost_Test:
              targetRef: congruency_test
              transformation: "{statistic: result.T[1], pvalue: result.p_unc[1], subjects: result.dof[1] + 1}"
            Out_Cost_File:
              targetRef: File_Congruency_Test
              transformation: "{statistic: result.T[1], pvalue: result.p_unc[1], subjects: result.dof[1] + 1}"
          additionalArguments:
            dv: result.isCorrect
            within: trialContext.congruency
            subject: context.subject
            alternative: greater
          implementation: python://pingouin.pairwise_tests
        Congruency_Decision:
          type: ExclusiveGateway
          name: Less accurate when incongruent?
          default: C_No
        C_Supported:
          type: EndEvent
          name: Supported
        C_Not_Supported:
          type: EndEvent
          name: Not supported
        C_Not_Testable:
          type: EndEvent
          name: Not testable
        File_Congruency_Test:
          type: DataObjectReference
          name: Congruency test
          uri: results/congruency_test.json
        CF_0: C_Start -> Congruency_Table
        CF_1: Congruency_Table -> Enough_Subjects
        C_Too_Few:
          name: too few
          conditionExpression: analysed_subjects < min_subjects
          sourceRef: Enough_Subjects
          targetRef: C_Not_Testable
        C_Enough:
          name: enough
          sourceRef: Enough_Subjects
          targetRef: Cost_Test
        CF_2: Cost_Test -> Congruency_Decision
        C_Yes:
          name: "yes"
          conditionExpression: congruency_test.pvalue < alpha
          sourceRef: Congruency_Decision
          targetRef: C_Supported
        C_No:
          name: "no"
          sourceRef: Congruency_Decision
          targetRef: C_Not_Supported
