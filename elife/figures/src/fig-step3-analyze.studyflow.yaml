id: step3_analyze
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Analyze:
  type: studyflow:Study
  name: Step 3 - Analyze
  documentation: >-
    Step 3 of the example study (`../study/example_study.studyflow`): its `Analysis` sub-process, unwrapped into a
    diagram of its own and otherwise unchanged — the same element ids, the same order, the same arguments. Seven
    preregistered operations read left to right and then wrap: read the recorded trials, keep the answered trials of the
    test blocks, per-subject accuracy in each task of the subjects the Completers dataset lists (the subject's process
    appends one line per completer), group statistics, then the two questions (the congruency effect within subjects,
    the difference between the two instruction conditions), each a collapsed sub-process that ends in a decision, and
    last the figure, when any subject was analysed. Accuracy is the measure throughout. The decision rules are one
    Parameters object wired into the two questions (in the study it is wired into `Analysis`, which holds them); the
    trials dataset is bound to the CSVW schema beside it. Every call is a library function named in full, so nothing
    here is code written for this study and the registered and the executed analysis are the same object.
  seed: 42
  dependencies:
    - pandas==2.3.3
    - scipy==1.16.2
    - scikit-learn==1.7.2
    - matplotlib==3.10.7
  properties:
    derived:
      name: derived
    answered:
      name: answered
    kept:
      name: kept
    test_trials:
      name: test_trials
    trials:
      name: trials
    per_subject_indexed:
      name: per_subject_indexed
    per_subject:
      name: per_subject
    analysed_trials:
      name: analysed_trials
    smallest_arm:
      name: smallest_arm
    analysed_subjects:
      name: analysed_subjects
  flowElements:
    Dataset_Trials:
      type: behaverse:BDMDataset
      name: Trials
      documentation: >-
        One line per recorded event, appended by every task of every subject: the build's own frame (`trialContext`)
        plus the subject and the properties of the scope that played the trial (`context`).
      schema: Trial_Schema
      dataLevel: trials
      uri: data/trials.jsonl
    Dataset_Completers:
      type: studyflow:Dataset
      name: Completers
      documentation: >-
        One line per subject who completed the protocol, appended by the step before the completion end event: the
        subject and its arm (`context`), keyed as the trials are. A subject excluded at screening or discontinued on
        either task has no line, so the analysis keeps exactly the subjects the participant flow counts as completed.
      schema: Completer_Schema
      uri: data/completers.jsonl
    Trial_Schema:
      type: studyflow:Schema
      name: Trial schema
      documentation: >-
        The columns the analysis reads from the trials dataset, as a CSVW table schema: the trial's keys, its
        congruency, and whether the answer was correct. `studyflow validate` checks every column an operation reading
        the dataset names against this list, so a misspelled column fails before any data moves.
      body:
        "@context": http://www.w3.org/ns/csvw
        tableSchema:
          columns:
            - name: context.subject
              datatype: string
            - name: context.state.arm
              datatype: string
            - name: trialContext.task.id
              datatype: string
            - name: trialContext.block.name
              datatype: string
            - name: trialContext.trial.id
              datatype: string
            - name: trialContext.congruency
              datatype: string
            - name: result.isCorrect
              datatype: boolean
    Completer_Schema:
      type: studyflow:Schema
      name: Completers schema
      documentation: >-
        The columns of the completers dataset, as a CSVW table schema: the subject and its arm, the keys the analysis
        matches the trials on. `studyflow validate` checks the keys the analysis names against it, and before its first
        line the dataset reads as a table with these columns and no row, so a cohort in which nobody completed is
        analysed as one with no subject.
      body:
        "@context": http://www.w3.org/ns/csvw
        tableSchema:
          columns:
            - name: context.subject
              datatype: string
            - name: context.state.arm
              datatype: string
    Decision_Rules:
      type: studyflow:Parameters
      name: Decision rules
      documentation: >-
        The thresholds every question's decision reads, fixed before the first run and kept once: the alpha of every
        test; the fewest subjects a within-subject test needs; the fewest subjects per arm a between-arm test needs,
        four being the smallest arms for which shuffling labels across subjects can reach p < .05; the permutations the
        difference test draws.
      values:
        alpha: 0.05
        min_subjects: 3
        min_per_arm: 4
        n_permutations: 1000
    An_Start:
      type: StartEvent
    Read_Trials:
      type: SubProcess
      name: Read the recorded trials
      documentation: >-
        The wire is the read: the dataset's `.jsonl` codec loads the run's event lines with pandas, and the two calls
        inside reduce them to one row per trial — the congruency the task drew and whether the answer was correct — with
        the trial keys as columns.
      flowElements:
        RT_Start:
          type: StartEvent
        Derive:
          type: ServiceTask
          name: One row per trial
          dataInputAssociations:
            In_Trials:
              sourceRef:
                - Dataset_Trials
              transformation: self
          dataOutputAssociations:
            Out_Derived:
              targetRef: derived
          additionalArguments:
            index:
              - context.subject
              - context.state.arm
              - trialContext.task.id
              - trialContext.block.name
              - trialContext.trial.id
            values:
              - trialContext.congruency
              - result.isCorrect
            aggfunc:
              trialContext.congruency: first
              result.isCorrect: first
          implementation: python://pandas.DataFrame.pivot_table
        Flatten_Index:
          type: ServiceTask
          name: Trial keys into columns
          dataInputAssociations:
            In_Derived:
              sourceRef:
                - derived
              transformation: self
          dataOutputAssociations:
            Out_Answered:
              targetRef: answered
          implementation: python://pandas.DataFrame.reset_index
        RT_End:
          type: EndEvent
        RTF_0: RT_Start -> Derive
        RTF_1: Derive -> Flatten_Index
        RTF_2: Flatten_Index -> RT_End
    Filter:
      type: SubProcess
      name: Keep answered test trials
      documentation: >-
        The trials the actor did not answer within the response window leave the table, and so do the 1-back's tutorial
        and practice blocks, which are instruction rather than measurement; the two measures the rest of the analysis
        works on become numbers.
      checklist: |-
        - [ ] Trials the actor did not answer within the response window dropped
        - [ ] The 1-back's tutorial and practice blocks dropped
        - [ ] Every remaining trial carries its task and block
      flowElements:
        F_Start:
          type: StartEvent
        Filter_Rows:
          type: ServiceTask
          name: Drop unanswered trials
          dataInputAssociations:
            In_Answered:
              sourceRef:
                - answered
              transformation: self
          dataOutputAssociations:
            Out_Kept:
              targetRef: kept
          additionalArguments:
            subset:
              - result.isCorrect
          implementation: python://pandas.DataFrame.dropna
        Test_Blocks:
          type: ServiceTask
          name: Keep the test blocks
          documentation: >-
            The blocks the analysis measures, named as the timelines name them: the Simon block and the 1-back's two
            test blocks.
          dataInputAssociations:
            In_Kept_Blocks:
              sourceRef:
                - kept
              transformation: self
          dataOutputAssociations:
            Out_Test:
              targetRef: test_trials
          additionalArguments:
            expr: "`trialContext.block.name` in ['Simon', 'XCIT_NB_01_Test_A', 'XCIT_NB_01_Test_B']"
          implementation: python://pandas.DataFrame.query
        Measures:
          type: ServiceTask
          name: Measures as numbers
          dataInputAssociations:
            In_Kept:
              sourceRef:
                - test_trials
              transformation: self
          dataOutputAssociations:
            Out_Trials_Typed:
              targetRef: trials
          additionalArguments:
            dtype:
              result.isCorrect: float
          implementation: python://pandas.DataFrame.astype
        F_End:
          type: EndEvent
        FF_0: F_Start -> Filter_Rows
        FF_1: Filter_Rows -> Test_Blocks
        FF_2: Test_Blocks -> Measures
        FF_3: Measures -> F_End
    Per_Subject:
      type: SubProcess
      name: Per-subject accuracy by task
      documentation: >-
        The analysed population and its summary: the trials of the subjects who completed the protocol, as the
        completers dataset lists them, which every question and the figure read; one row per subject, its mean accuracy
        in each task, with the subject and its arm as columns, written out as the per-subject table of the results
        dataset; then the size of the smaller arm, which the difference question checks against the decision rules
        before it tests anything.
      flowElements:
        PS_Start:
          type: StartEvent
        Completer_Trials:
          type: ServiceTask
          name: Trials of the subjects who completed
          documentation: >-
            The analysed population: the trials of the subjects with a line in the completers dataset, matched on the
            subject and its arm. A subject discontinued on either task, the 1-back included, has trials but no line, and
            leaves here.
          dataInputAssociations:
            In_Trials_All:
              sourceRef:
                - trials
              transformation: self
            In_Completers:
              sourceRef:
                - Dataset_Completers
              transformation: right
          dataOutputAssociations:
            Out_Analysed_Trials:
              targetRef: analysed_trials
          additionalArguments:
            "on":
              - context.subject
              - context.state.arm
            how: inner
          implementation: python://pandas.DataFrame.merge
        Per_Subject_Table:
          type: ServiceTask
          name: Per-subject summary
          dataInputAssociations:
            In_Trials_PS:
              sourceRef:
                - analysed_trials
              transformation: self
          dataOutputAssociations:
            Out_PS:
              targetRef: per_subject_indexed
          additionalArguments:
            index:
              - context.subject
              - context.state.arm
            columns: trialContext.task.id
            values: result.isCorrect
            aggfunc: mean
          implementation: python://pandas.DataFrame.pivot_table
        Per_Subject_Flat:
          type: ServiceTask
          name: Subject keys into columns
          dataInputAssociations:
            In_PS:
              sourceRef:
                - per_subject_indexed
              transformation: self
          dataOutputAssociations:
            Out_PS_Flat:
              targetRef: per_subject
            Out_PS_File:
              targetRef: File_PerSubject
          implementation: python://pandas.DataFrame.reset_index
        Arm_Sizes:
          type: ServiceTask
          name: Subjects per arm
          documentation: >-
            How many subjects each arm holds; the smaller count is what the feasibility checks read, and an arm nobody
            reached counts as zero. Their sum is how many subjects were analysed, which the figure checks.
          dataInputAssociations:
            In_PS_Arms:
              sourceRef:
                - per_subject
              transformation: self
          dataOutputAssociations:
            Out_Smallest_Arm:
              targetRef: smallest_arm
              transformation: if count(result) = 2 then min(result) else 0
            Out_Analysed_Subjects:
              targetRef: analysed_subjects
              transformation: if count(result) = 0 then 0 else sum(result)
          additionalArguments:
            subset:
              - context.state.arm
          implementation: python://pandas.DataFrame.value_counts
        File_PerSubject:
          type: DataObjectReference
          name: Per-subject table
          uri: results/per_subject.csv
        PS_End:
          type: EndEvent
        PSF_0: PS_Start -> Completer_Trials
        PSF_1: Completer_Trials -> Per_Subject_Table
        PSF_2: Per_Subject_Table -> Per_Subject_Flat
        PSF_3: Per_Subject_Flat -> Arm_Sizes
        PSF_4: Arm_Sizes -> PS_End
    Group:
      type: ServiceTask
      name: Group statistics
      documentation: >-
        Mean and standard deviation of each task's accuracy, by instruction condition, from the per-subject table while
        the subject and its arm are still its index, so the arm is grouped by and every column is an accuracy.
      dataInputAssociations:
        In_PS_G:
          sourceRef:
            - per_subject_indexed
          transformation: self
      dataOutputAssociations:
        Out_Group:
          targetRef: File_Group
      additionalArguments:
        index: context.state.arm
        aggfunc:
          - mean
          - std
      implementation: python://pandas.DataFrame.pivot_table
    Congruency:
      type: SubProcess
      name: Congruency effect
      documentation: >-
        Is a subject less accurate on incongruent than on congruent Simon trials? Per subject, the mean accuracy on
        congruent trials minus the mean on incongruent ones, tested against zero in the predicted direction with a
        one-sided one-sample t test. The decision was fixed before the first run: not testable with fewer subjects than
        the decision rules' minimum, supported when p is below their alpha, not supported otherwise. The descriptive
        table by instruction condition and congruency is written out either way.
      properties:
        by_congruency:
          name: by_congruency
        accuracy_congruent:
          name: accuracy_congruent
        accuracy_incongruent:
          name: accuracy_incongruent
        congruency_costs:
          name: congruency_costs
        congruency_n:
          name: congruency_n
        congruency_test:
          name: congruency_test
      dataInputAssociations:
        In_Rules_C:
          sourceRef:
            - Decision_Rules
      flowElements:
        C_Start:
          type: StartEvent
        Cost_Per_Subject:
          type: SubProcess
          name: Accuracy cost per subject
          documentation: >-
            The descriptive table by instruction condition and congruency, written out as it stands; then, per subject,
            the mean accuracy on congruent trials minus the mean on incongruent ones, and how many subjects have both.
          flowElements:
            CP_Start:
              type: StartEvent
            Congruency_Table:
              type: ServiceTask
              name: Accuracy by congruency
              dataInputAssociations:
                In_Trials_C:
                  sourceRef:
                    - analysed_trials
                  transformation: self
              dataOutputAssociations:
                Out_Congruency:
                  targetRef: File_Congruency
              additionalArguments:
                index:
                  - context.state.arm
                  - trialContext.congruency
                values:
                  - result.isCorrect
                aggfunc: mean
              implementation: python://pandas.DataFrame.pivot_table
            By_Congruency:
              type: ServiceTask
              name: Accuracy, one column per congruency
              dataInputAssociations:
                In_Trials_BC:
                  sourceRef:
                    - analysed_trials
                  transformation: self
              dataOutputAssociations:
                Out_BC:
                  targetRef: by_congruency
              additionalArguments:
                index: context.subject
                columns: trialContext.congruency
                values: result.isCorrect
                aggfunc: mean
              implementation: python://pandas.DataFrame.pivot_table
            Accuracy_Incongruent:
              type: ServiceTask
              name: Incongruent accuracies
              documentation: The incongruent column, one accuracy per subject; empty when no subject was analysed.
              dataInputAssociations:
                In_BC_I:
                  sourceRef:
                    - by_congruency
                  transformation: self
              dataOutputAssociations:
                Out_Incongruent:
                  targetRef: accuracy_incongruent
              additionalArguments:
                key: Incongruent
                default:
                  implementation: python://pandas.Series
                  arguments:
                    dtype: float
              implementation: python://pandas.DataFrame.get
            Accuracy_Congruent:
              type: ServiceTask
              name: Congruent accuracies
              documentation: The congruent column, one accuracy per subject; empty when no subject was analysed.
              dataInputAssociations:
                In_BC_C:
                  sourceRef:
                    - by_congruency
                  transformation: self
              dataOutputAssociations:
                Out_Congruent:
                  targetRef: accuracy_congruent
              additionalArguments:
                key: Congruent
                default:
                  implementation: python://pandas.Series
                  arguments:
                    dtype: float
              implementation: python://pandas.DataFrame.get
            Cost:
              type: ServiceTask
              name: Congruency cost per subject
              dataInputAssociations:
                In_Cost_C:
                  sourceRef:
                    - accuracy_congruent
                  transformation: self
                In_Cost_I:
                  sourceRef:
                    - accuracy_incongruent
                  transformation: other
              dataOutputAssociations:
                Out_Costs:
                  targetRef: congruency_costs
                Out_Cost_N:
                  targetRef: congruency_n
                  transformation: count(result)
              implementation: python://pandas.Series.sub
            File_Congruency:
              type: DataObjectReference
              name: Congruency table
              uri: results/congruency.csv
            CP_End:
              type: EndEvent
            CPF_0: CP_Start -> Congruency_Table
            CPF_1: Congruency_Table -> By_Congruency
            CPF_2: By_Congruency -> Accuracy_Congruent
            CPF_3: Accuracy_Congruent -> Accuracy_Incongruent
            CPF_4: Accuracy_Incongruent -> Cost
            CPF_5: Cost -> CP_End
        Enough_Subjects:
          type: ExclusiveGateway
          name: Enough subjects?
          default: C_Enough
        Cost_Test:
          type: ServiceTask
          name: One-sided t test
          dataInputAssociations:
            In_Costs:
              sourceRef:
                - congruency_costs
              transformation: a
          dataOutputAssociations:
            Out_Cost_Test:
              targetRef: congruency_test
              transformation: "{statistic: result.statistic, pvalue: result.pvalue}"
            Out_Cost_File:
              targetRef: File_Congruency_Test
              transformation: "{statistic: result.statistic, pvalue: result.pvalue, subjects: congruency_n}"
          additionalArguments:
            popmean: 0
            alternative: greater
            nan_policy: omit
          implementation: python://scipy.stats.ttest_1samp
        Congruency_Decision:
          type: ExclusiveGateway
          name: Less accurate when incongruent?
          default: C_No
        C_Supported:
          type: EndEvent
          name: Supported
        C_Not_Supported:
          type: EndEvent
          name: Not supported
        C_Not_Testable:
          type: EndEvent
          name: Not testable
        File_Congruency_Test:
          type: DataObjectReference
          name: Congruency test
          uri: results/congruency_test.json
        CF_0: C_Start -> Cost_Per_Subject
        CF_1: Cost_Per_Subject -> Enough_Subjects
        C_Too_Few:
          name: too few
          conditionExpression: congruency_n < min_subjects
          sourceRef: Enough_Subjects
          targetRef: C_Not_Testable
        C_Enough:
          name: enough
          sourceRef: Enough_Subjects
          targetRef: Cost_Test
        CF_2: Cost_Test -> Congruency_Decision
        C_Yes:
          name: "yes"
          conditionExpression: congruency_test.pvalue < alpha
          sourceRef: Congruency_Decision
          targetRef: C_Supported
        C_No:
          name: "no"
          sourceRef: Congruency_Decision
          targetRef: C_Not_Supported
    Divergence:
      type: SubProcess
      name: Difference between instructions
      documentation: >-
        Can a classifier tell the two instruction conditions apart better than chance? One row per subject, its accuracy
        in each of the two tasks as standardized features and its arm as the label, a logistic regression scored by
        leave-one-subject-out cross-validation; the permutation test shuffles the arm labels across subjects, the unit
        that was randomized, so chance is what the same classifier scores when the labels carry nothing. Fixed before
        the first run: not testable when an arm holds fewer subjects than the decision rules' minimum, supported when
        the permutation p is below their alpha, not supported otherwise.
      properties:
        subject_features:
          name: subject_features
        subject_labels:
          name: subject_labels
        divergence_test:
          name: divergence_test
      dataInputAssociations:
        In_Rules_D:
          sourceRef:
            - Decision_Rules
      flowElements:
        D_Start:
          type: StartEvent
        Enough_Per_Arm_D:
          type: ExclusiveGateway
          name: Enough subjects per arm?
          default: D_Enough
        Features:
          type: ServiceTask
          name: Accuracy in each task
          documentation: The per-subject table without its key columns, one column per task, so the features are the tasks.
          dataInputAssociations:
            In_PS_F:
              sourceRef:
                - per_subject
              transformation: self
          dataOutputAssociations:
            Out_Features:
              targetRef: subject_features
          additionalArguments:
            columns:
              - context.subject
              - context.state.arm
          implementation: python://pandas.DataFrame.drop
        Labels:
          type: ServiceTask
          name: Subject-level labels
          dataInputAssociations:
            In_PS_L:
              sourceRef:
                - per_subject
              transformation: self
          dataOutputAssociations:
            Out_Labels:
              targetRef: subject_labels
          additionalArguments:
            key: context.state.arm
          implementation: python://pandas.DataFrame.get
        Permutation_Test:
          type: ServiceTask
          name: Classifier against shuffled labels
          dataInputAssociations:
            In_Features:
              sourceRef:
                - subject_features
              transformation: X
            In_Labels:
              sourceRef:
                - subject_labels
              transformation: "y"
          dataOutputAssociations:
            Out_Divergence_Test:
              targetRef: divergence_test
              transformation: "{accuracy: result[1], pvalue: result[3]}"
            Out_Divergence:
              targetRef: File_Divergence
              transformation: "{accuracy: result[1], pvalue: result[3]}"
          additionalArguments:
            estimator:
              implementation: python://sklearn.pipeline.make_pipeline
              arguments:
                args:
                  - implementation: python://sklearn.preprocessing.StandardScaler
                  - implementation: python://sklearn.linear_model.LogisticRegression
                    arguments:
                      max_iter: 1000
            cv:
              implementation: python://sklearn.model_selection.LeaveOneOut
            n_permutations: "{n_permutations}"
            scoring: accuracy
          implementation: python://sklearn.model_selection.permutation_test_score
        Divergence_Decision:
          type: ExclusiveGateway
          name: Told apart above chance?
          default: D_No
        D_Supported:
          type: EndEvent
          name: Supported
        D_Not_Supported:
          type: EndEvent
          name: Not supported
        D_Not_Testable:
          type: EndEvent
          name: Not testable
        File_Divergence:
          type: DataObjectReference
          name: Difference test
          uri: results/divergence.json
        DF_0: D_Start -> Enough_Per_Arm_D
        D_Too_Few:
          name: too few
          conditionExpression: smallest_arm < min_per_arm
          sourceRef: Enough_Per_Arm_D
          targetRef: D_Not_Testable
        D_Enough:
          name: enough
          sourceRef: Enough_Per_Arm_D
          targetRef: Features
        DF_1: Features -> Labels
        DF_2: Labels -> Permutation_Test
        DF_3: Permutation_Test -> Divergence_Decision
        D_Yes:
          name: "yes"
          conditionExpression: divergence_test.pvalue < alpha
          sourceRef: Divergence_Decision
          targetRef: D_Supported
        D_No:
          name: "no"
          sourceRef: Divergence_Decision
          targetRef: D_Not_Supported
    Anyone_Analysed:
      type: ExclusiveGateway
      name: Anyone analysed?
      default: AF_No_Figure
    Plot:
      type: ServiceTask
      name: Figure
      documentation: Accuracy by instruction condition and congruency, as a box plot.
      dataInputAssociations:
        In_Trials_P:
          sourceRef:
            - analysed_trials
          transformation: self
      dataOutputAssociations:
        Out_Plot:
          targetRef: File_Accuracy
          transformation: result.figure
      additionalArguments:
        column:
          - result.isCorrect
        by:
          - context.state.arm
          - trialContext.congruency
        grid: false
        rot: 30
      implementation: python://pandas.DataFrame.boxplot
    An_End:
      type: EndEvent
      name: Analyzed
    File_Group:
      type: DataObjectReference
      name: Group table
      uri: results/group.csv
    File_Accuracy:
      type: DataObjectReference
      name: Accuracy figure
      uri: results/accuracy.png
    AF_0: An_Start -> Read_Trials
    AF_1: Read_Trials -> Filter
    AF_2: Filter -> Per_Subject
    AF_3: Per_Subject -> Group
    AF_4: Group -> Congruency
    AF_5: Congruency -> Divergence
    AF_7: Divergence -> Anyone_Analysed
    AF_Figure:
      name: "yes"
      conditionExpression: analysed_subjects > 0
      sourceRef: Anyone_Analysed
      targetRef: Plot
    AF_No_Figure:
      name: "no"
      sourceRef: Anyone_Analysed
      targetRef: An_End
    AF_8: Plot -> An_End
layout:
