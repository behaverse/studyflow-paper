id: example_study_overview
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Example_Study:
  type: studyflow:Study
  name: Example study (overview)
  documentation: >-
    The example study (`../study/example_study.studyflow`) compacted to one row for the overview figure (@fig-overview):
    the same element ids, the pool of four parallel subjects flattened to the one subject it repeats, the analysis
    collapsed to one box, and the three pools, the message flows and the per-subject end of session (the debrief and
    the step that records a completer) dropped for width. What is
    left is laid out left to right under the four lifecycle stages. Every `n` is a run-state value the runner writes as
    the cohort runs; they all read zero here because this figure is drawn from the deposited plan. Its Gantt, Checklist
    and Provenance views are the modeler's own renderings of it.
  seed: 42
  dependencies:
    - pandas==2.3.3
    - scipy==1.16.2
    - scikit-learn==1.7.2
    - matplotlib==3.10.7
  authors:
    - Morteza Ansarinia
    - Hoorieh Afkari Roshan
    - Pedro Cardoso-Leite
  version: "1.0"
  properties:
    P_Arm:
      name: arm
      value: none
    P_Instruction:
      name: instruction
      value: none
  flowElements:
    Enroll:
      type: StartEvent
      name: Enrolled and consented
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:01:17.635+02:00"
          run: run
          commit: 53c7dfd054d22a1cba23d60d20b2de81777face2
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:29:13.794+02:00"
          run: rerun
          commit: a7bc99cfce062aabeff0904e83e50da664328612
      onset: T0
      consentFormUri: https://behaverse.org/protocols/example-study/consent.md
    Screening:
      type: cognitive:Questionnaire
      name: Assessed for eligibility (n={reached})
      instrument: comprehension-check
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:01:17.702+02:00"
          run: run
          commit: 2da1be3e47a3482c699f549aa27a7b02d81d7cfa
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:29:13.856+02:00"
          run: rerun
          commit: d986a5edbcabdbe23577490facb2fc94a881d99e
      checklist: |-
        - [x] Consent recorded
        - [x] Executor configuration pinned (model id, sampling parameters)
        - [x] Comprehension check passed
      onset: T0
      duration: 10s
    Eligibility_Gateway:
      type: cognitive:EligibilityGateway
      name: Understood the instructions?
      inclusionCriteria:
        - Registered artificial actor family with a pinned model tag
        - Comprehension check answered as instructed
      exclusionCriteria:
        - No answer, or an answer that does not follow the instruction
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:01:17.811+02:00"
          what: Flow_Eligible
          run: run
          commit: dd8eab6a0d69868bfa3429db921c0516ccfc3fff
        - type: prov:Activity
          action: reused
          when: "2026-10-02T07:29:13.956+02:00"
          what: "2026-09-29T23:01:17.811+02:00"
          run: rerun
      default: Flow_Excluded_Pre
    Excluded_Pre:
      type: EndEvent
      name: "Excluded: did not understand the task (n={reached})"
    Randomize_Disposition:
      type: cognitive:RandomGateway
      name: Which disposition? (n={reached})
      algorithm: block
      allocationRatio: "1:1"
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:01:17.919+02:00"
          what: Flow_Allocate_Impulsive
          run: run
          commit: 855dbe5b9ba86d491a0655184def6dcd45b89743
        - type: prov:Activity
          action: reused
          when: "2026-10-02T07:29:14.046+02:00"
          what: "2026-09-29T23:01:17.919+02:00"
          run: rerun
      default: Flow_Allocate_Impulsive
    Allocate_Cautious:
      type: ServiceTask
      name: Allocated to cautious (n={reached})
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:00:51.808+02:00"
          run: run
          commit: 35705098ba02609b410a535b9ff1136856d0a275
      onset: T0
      duration: 1s
      additionalArguments:
        arm: cautious
        instruction: Take your time on every trial. Answer only when you are sure; accuracy matters more than speed.
      implementation: python://builtins.dict
    Allocate_Impulsive:
      type: ServiceTask
      name: Allocated to impulsive (n={reached})
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:01:18.206+02:00"
          run: run
          commit: 263e4ad89320cd2294fe0f869cb5f40f841a50bf
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:29:14.303+02:00"
          run: rerun
          commit: f7553f97f03e93443f7c93ea67a0d33863741269
      onset: T0
      duration: 1s
      additionalArguments:
        arm: impulsive
        instruction: Go with your first impression on every trial. Answer as fast as you can; speed matters more than accuracy.
      implementation: python://builtins.dict
    Prompt_Battery:
      type: agentic:Prompt
      name: Disposition prompt
      template: |
        {instruction}

        You are taking a computerised cognitive test one trial at a time. Each message is one trial, as
        JSON. Your answer is one of the strings in that trial's own ResponseOptions, copied exactly and
        with nothing else.
    Task_Interference:
      type: behaverse:Task
      name: Interference control (Simon)
      instrument: WO
      timeline: SimonTask
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:01:27.337+02:00"
          run: run
          commit: 762b168ba7cf0676ffde2fd62a70b5eb65114525
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:29:22.805+02:00"
          run: rerun
          commit: d0d6c29e9c4810744e08854d74463dcdcb8dc6ef
      onset: T0+20s
      duration: 40s
      dataInputAssociations:
        In_Prompt_Interference:
          sourceRef:
            - Prompt_Battery
    Failed_Interference:
      type: BoundaryEvent
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_Interference:
          type: ConditionalEventDefinition
          condition: "{Task_Interference.failedTrialRate} > 0.2"
      attachedToRef: Task_Interference
    Task_WorkingMemory:
      type: behaverse:Task
      name: Working memory (1-back)
      instrument: NB
      timeline: XCIT_NB_01
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:01:44.212+02:00"
          run: run
          commit: 39005f94265efff78edc15df48128e783aaf53fb
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:29:38.037+02:00"
          run: rerun
          commit: cca7afdbe7a8149e21d3373b033cd8e3d932cfaa
      onset: T0+60s
      duration: 3min
      dataOutputAssociations:
        Out_Trials_WorkingMemory:
          targetRef: Dataset_Trials
    Failed_WorkingMemory:
      type: BoundaryEvent
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_WorkingMemory:
          type: ConditionalEventDefinition
          condition: "{Task_WorkingMemory.failedTrialRate} > 0.2"
      attachedToRef: Task_WorkingMemory
    Dataset_Trials:
      type: behaverse:BDMDataset
      name: Trials
      dataLevel: trials
      extensionElements:
        - type: prov:Activity
          action: created
          when: "2026-09-29T23:01:44.211+02:00"
          run: run
        - type: prov:Activity
          action: created
          when: "2026-10-02T07:29:38.037+02:00"
          run: rerun
      uri: data/trials.jsonl
    Discontinued:
      type: EndEvent
      name: "Discontinued: more than 20% of trials unanswered (n={reached})"
    Analysis:
      type: SubProcess
      name: Analysis
      documentation: Seven preregistered operations, collapsed here; @fig-step3-analyze draws them.
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:02:15.868+02:00"
          run: run
          commit: bf31ffb5a1ebd383a758a4da7e5b451a3e8b9297
        - type: prov:Activity
          action: invalidated
          when: "2026-10-02T07:26:25.949+02:00"
          who: morteza
          with: studyflow-modeler/26.9.29
          what: "2026-09-29T23:02:15.868+02:00"
          run: run
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:30:13.095+02:00"
          run: rerun
          commit: 6283b44132f25f4cc40ba81dcc165b43404c7e76
      checklist: |-
        - [x] Trials the actor did not answer within the response window dropped
        - [x] The 1-back's tutorial and practice blocks dropped
        - [x] Every remaining trial carries its task and block
      onset: T0+6min
      duration: 30s
    Render:
      type: ManualTask
      name: Render the report
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:02:16.076+02:00"
          run: run
          commit: 53c7dfd054d22a1cba23d60d20b2de81777face2
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:30:13.196+02:00"
          run: rerun
          commit: a7bc99cfce062aabeff0904e83e50da664328612
      checklist: |-
        - [x] CONSORT participant flow exported from the Figure view
        - [x] SPIRIT schedule exported from the Gantt view
        - [x] CHART items recorded from the run provenance
      onset: T0+7min
      duration: 2min
    Completed:
      type: EndEvent
      name: Study complete
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-29T23:02:16.233+02:00"
          run: run
          commit: 53c7dfd054d22a1cba23d60d20b2de81777face2
        - type: prov:Activity
          action: executed
          when: "2026-10-02T07:30:13.294+02:00"
          run: rerun
          commit: a7bc99cfce062aabeff0904e83e50da664328612
    Flow_Enroll_Screening: Enroll -> Screening
    Flow_Screening_Eligibility: Screening -> Eligibility_Gateway
    Flow_Eligible: Eligibility_Gateway -> Randomize_Disposition
    Flow_Excluded_Pre:
      name: "no"
      sourceRef: Eligibility_Gateway
      targetRef: Excluded_Pre
    Flow_Allocate_Cautious:
      name: cautious
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Cautious
    Flow_Allocate_Impulsive:
      name: impulsive
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Impulsive
    Flow_Cautious_Interference: Allocate_Cautious -> Task_Interference
    Flow_Impulsive_Interference: Allocate_Impulsive -> Task_Interference
    Flow_Interference_WorkingMemory: Task_Interference -> Task_WorkingMemory
    Flow_Failed_Interference: Failed_Interference -> Discontinued
    Flow_Failed_WorkingMemory: Failed_WorkingMemory -> Discontinued
    Flow_WorkingMemory_Analysis: Task_WorkingMemory -> Analysis
    Flow_Analysis_Render: Analysis -> Render
    Flow_Render_Completed: Render -> Completed
