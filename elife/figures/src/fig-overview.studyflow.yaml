id: example_study_overview
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Example_Study:
  type: studyflow:Study
  name: Example study (overview)
  documentation: >-
    The example study (`../study/example_study.studyflow`) compacted to one row for the overview figure (@fig-overview):
    the same element ids, the pool of eight parallel subjects flattened to the one subject it repeats, the analysis
    collapsed to one box, and the three pools, the message flows, the debrief and the step that records a completer
    dropped for width. As in the study, the subject's row ends at its completion end event, reached once per subject,
    and the analysis starts at its own start event, once the last subject is done. What is left is laid out left to
    right under the four lifecycle stages. Every `n` is a run-state value the runner writes as the cohort runs; here
    they are the counts of the pipeline-check run whose state this figure carries (see `../README.md`), and each flow
    the compaction draws carries the count of the path it stands for in that run. Its Gantt, Checklist and Provenance
    views are the modeler's own renderings of it.
  seed: 42
  dependencies:
    - pandas==2.3.3
    - scipy==1.16.2
    - scikit-learn==1.7.2
    - matplotlib==3.10.7
  authors:
    - Morteza Ansarinia
    - Hoorieh Afkari Roshan
    - Pedro Cardoso-Leite
  version: "1.0"
  properties:
    P_MaxUnanswered:
      name: max_unanswered
      value: 0.2
    P_Arm:
      name: arm
      value: none
    P_Instruction:
      name: instruction
      value: none
  flowElements:
    Enroll:
      type: StartEvent
      name: Enrolled and consented
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:52.518+02:00"
          run: run-planted
          commit: 9e69a576b5cfee81e096b7ab70ad1042fa0781f4
      onset: T0
      consentFormUri: https://behaverse.org/protocols/example-study/consent.md
    Screening:
      type: cognitive:Questionnaire
      name: Assessed for eligibility (n={reached})
      instrument: comprehension-check
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:52.519+02:00"
          run: run-planted
          commit: 8458fc986f31bc4b896c474890a4e1ae82278ece
      checklist: |-
        - [x] Consent recorded
        - [x] Executor configuration pinned (model id, sampling parameters)
        - [x] Comprehension check passed
      onset: T0
      duration: 10s
    Eligibility_Gateway:
      type: cognitive:EligibilityGateway
      name: Understood the instructions?
      inclusionCriteria:
        - Registered artificial actor family with a pinned model tag
        - Comprehension check answered as instructed
      exclusionCriteria:
        - No answer, or an answer that does not follow the instruction
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:52.538+02:00"
          what: Flow_Eligible
          run: run-planted
          commit: 68027048aa09556256c57d15933e3895f16fb2b9
      default: Flow_Excluded_Pre
    Excluded_Pre:
      type: EndEvent
      name: "Excluded: did not understand the task (n={reached})"
    Randomize_Disposition:
      type: cognitive:RandomGateway
      name: Which instruction? (n={reached})
      algorithm: block
      allocationRatio: "1:1"
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:52.558+02:00"
          what: Flow_Allocate_Cautious
          run: run-planted
          commit: c15a30a312b6f5e6642275ef6baa244d6305306e
      default: Flow_Allocate_Impulsive
    Allocate_Cautious:
      type: ServiceTask
      name: Allocated to the cautious instruction (n={reached})
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:52.578+02:00"
          run: run-planted
          commit: cf871ca7b526aadfae2d36b4111b66d92f4b5f0c
      onset: T0
      duration: 1s
      additionalArguments:
        arm: cautious
        instruction: Take your time on every trial. Answer only when you are sure; accuracy matters more than speed.
      implementation: python://builtins.dict
    Allocate_Impulsive:
      type: ServiceTask
      name: Allocated to the impulsive instruction (n={reached})
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:49.020+02:00"
          run: run-planted
          commit: ce83c73b1c8c93f2038e13e34bef3139b8052779
      onset: T0
      duration: 1s
      additionalArguments:
        arm: impulsive
        instruction: Go with your first impression on every trial. Answer as fast as you can; speed matters more than accuracy.
      implementation: python://builtins.dict
    Prompt_Battery:
      type: agentic:Prompt
      name: Battery prompt
      template: |
        {instruction}

        You are taking a computerised cognitive test one trial at a time. Each message is one trial, as
        JSON. Your answer is one of the strings in that trial's own ResponseOptions, copied exactly and
        with nothing else.
    Task_Interference:
      type: behaverse:Task
      name: Interference control (Simon)
      instrument: WO
      timeline: SimonTask
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:53.753+02:00"
          run: run-planted
          commit: 4cc128f6352cd0b72f965370392462e6c9a5bc23
      onset: T0+20s
      duration: 40s
      dataInputAssociations:
        In_Prompt_Interference:
          sourceRef:
            - Prompt_Battery
    Failed_Interference:
      type: BoundaryEvent
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_Interference:
          type: ConditionalEventDefinition
          condition: "{Task_Interference.failedTrialRate} > max_unanswered"
      attachedToRef: Task_Interference
    Task_WorkingMemory:
      type: behaverse:Task
      name: Working memory (1-back)
      instrument: NB
      timeline: XCIT_NB_01
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:55.721+02:00"
          run: run-planted
          commit: 46af6df211e078dbce98f31197fa182ca79307a9
      onset: T0+60s
      duration: 3min
      dataOutputAssociations:
        Out_Trials_WorkingMemory:
          targetRef: Dataset_Trials
    Failed_WorkingMemory:
      type: BoundaryEvent
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_WorkingMemory:
          type: ConditionalEventDefinition
          condition: "{Task_WorkingMemory.failedTrialRate} > max_unanswered"
      attachedToRef: Task_WorkingMemory
    Dataset_Trials:
      type: behaverse:BDMDataset
      name: Trials
      dataLevel: trials
      extensionElements:
        - type: prov:Activity
          action: created
          when: "2026-10-02T19:29:55.721+02:00"
          run: run-planted
      uri: data/trials.jsonl
    Discontinued:
      type: EndEvent
      name: "Discontinued: more than 20% of trials unanswered (n={reached})"
    Sub_End:
      type: EndEvent
      name: Completed the protocol (n={reached})
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:55.780+02:00"
          run: run-planted
          commit: 9e69a576b5cfee81e096b7ab70ad1042fa0781f4
    All_Complete:
      type: StartEvent
      name: All subjects complete
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:29:55.781+02:00"
          run: run-planted
          commit: 9e69a576b5cfee81e096b7ab70ad1042fa0781f4
      eventDefinitions:
        Def_All_Complete:
          type: MessageEventDefinition
    Analysis:
      type: SubProcess
      name: Analysis
      documentation: Seven preregistered operations, collapsed here; @fig-step3-analyze draws them.
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:30:08.043+02:00"
          run: run-planted
          commit: 4ece089d28dd1eef810706d940f4e52b34e98c0e
      checklist: |-
        - [x] Trials the actor did not answer within the response window dropped
        - [x] The 1-back's tutorial and practice blocks dropped
        - [x] Every remaining trial carries its task and block
      onset: T0+6min
      duration: 30s
    Render:
      type: ManualTask
      name: Render the report
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:30:08.061+02:00"
          run: run-planted
          commit: 9e69a576b5cfee81e096b7ab70ad1042fa0781f4
      checklist: |-
        - [x] CONSORT participant flow exported from the Figure view
        - [x] SPIRIT schedule exported from the Gantt view
        - [x] Model, prompts and sampling settings recorded with each exchange
      onset: T0+7min
      duration: 2min
    Completed:
      type: EndEvent
      name: Study complete
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-10-02T19:30:08.079+02:00"
          run: run-planted
          commit: 9e69a576b5cfee81e096b7ab70ad1042fa0781f4
    Flow_Enroll_Screening: Enroll -> Screening
    Flow_Screening_Eligibility: Screening -> Eligibility_Gateway
    Flow_Eligible: Eligibility_Gateway -> Randomize_Disposition
    Flow_Excluded_Pre:
      name: "no"
      sourceRef: Eligibility_Gateway
      targetRef: Excluded_Pre
    Flow_Allocate_Cautious:
      name: cautious
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Cautious
    Flow_Allocate_Impulsive:
      name: impulsive
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Impulsive
    Flow_Cautious_Interference: Allocate_Cautious -> Task_Interference
    Flow_Impulsive_Interference: Allocate_Impulsive -> Task_Interference
    Flow_Interference_WorkingMemory: Task_Interference -> Task_WorkingMemory
    Flow_Failed_Interference: Failed_Interference -> Discontinued
    Flow_Failed_WorkingMemory: Failed_WorkingMemory -> Discontinued
    Flow_WorkingMemory_End: Task_WorkingMemory -> Sub_End
    Flow_Start_Analysis: All_Complete -> Analysis
    Flow_Analysis_Render: Analysis -> Render
    Flow_Render_Completed: Render -> Completed
