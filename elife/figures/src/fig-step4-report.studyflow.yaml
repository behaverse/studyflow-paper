id: step4_report
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Report_Collaboration:
  type: Collaboration
  name: Step 4 - Report
  documentation: >-
    Step 4 of the example study (`../study/example_study.studyflow`): everything the study does for reporting, with the
    study's own element ids, and in the two pools the study itself uses, because the two halves run on different beats.
    In the subjects' pool, once per subject, a debrief closes the session and the instance ends at `Completed the
    protocol`; the pool carries the parallel marker for its eight instances. In the analysis and report pool, once,
    after the analysis, a manual activity renders the reporting artifacts from the results dataset and the study ends at
    `Completed`. The render is manual on purpose — a person reads the figures before they go into the manuscript — and
    nothing else is added for reporting: the CONSORT flow (@fig-consort), the SPIRIT schedule, the checklist and the
    provenance record (@fig-views) are views of this same file. The counts are zero because nothing has run: this is the
    deposited plan.
  extensionElements:
    - type: studyflow:Study
      seed: 42
  participants:
    Participant_Subject:
      name: Each subject
      participantMultiplicity:
        minimum: 8
        maximum: 8
      processRef: Subject_Report
    Participant_Analysis:
      name: Analysis and report
      processRef: Report
Subject_Report:
  type: Process
  name: Each subject, at the end of its session
  flowElements:
    Battery_Done:
      type: StartEvent
      name: Battery complete
    Debrief:
      type: cognitive:Instruction
      name: Debrief
      content: The session is over. Thank you for taking part; nothing further is asked of you.
      onset: T0+80s
      duration: 1s
    Sub_End:
      type: EndEvent
      name: Completed the protocol (n={reached})
    SF_Battery_Debrief: Battery_Done -> Debrief
    SF_Debrief_End: Debrief -> Sub_End
Report:
  type: Process
  name: Once, after the analysis
  flowElements:
    R_Start:
      type: StartEvent
      name: Analyzed
    Render:
      type: ManualTask
      name: Render the report
      documentation: >-
        Not automated on purpose: `figures/src/render.sh` in the paper repository draws these from the executed copy of
        the study file, and a person reads them before they go into the manuscript.
      checklist: |-
        - [ ] CONSORT participant flow exported from the Figure view
        - [ ] SPIRIT schedule exported from the Gantt view
        - [ ] CHART items recorded from the run provenance
      dataInputAssociations:
        In_Results:
          sourceRef:
            - Dataset_Results
      onset: T0+7min
      duration: 2min
    Completed:
      type: EndEvent
      name: Study complete
    Dataset_Results:
      type: studyflow:Dataset
      name: Results
      format: psych-ds
      uri: results/
    Flow_Analyzed_Render: R_Start -> Render
    Flow_Render_Completed: Render -> Completed
