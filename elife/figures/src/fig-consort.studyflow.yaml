id: example_study_consort
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Consort_Collaboration:
  type: Collaboration
  name: Example study, CONSORT participant flow (Figure view after execution)
  documentation: >-
    The example study (`../study/example_study.studyflow`) projected as its CONSORT participant flow: the same element
    ids, the battery's prompts and pacing dropped, the analysis and the report collapsed to a black-box pool. The
    subject is a pool, divided into one lane per CONSORT phase, so the flow runs down through Enrolment, Allocation and
    Follow-up and each exit leaves from the phase it belongs to. The pool carries BPMN's parallel marker at its bottom:
    a participant multiplicity of eight, so the eight subjects are eight independent instances of the pool's process,
    each with its own exits. The actor pool and the trial exchange are dropped: a CONSORT flow is a participant flow,
    and the three pools of the study do not fit a column this narrow — @fig-combined shows them. Every `n` is a
    run-state value the runner writes as the cohort runs; they all read zero here because this figure is drawn from the
    deposited plan.
  extensionElements:
    - type: studyflow:Study
      seed: 42
      dependencies:
        - pandas==2.3.3
        - scipy==1.16.2
        - scikit-learn==1.7.2
        - matplotlib==3.10.7
      authors:
        - Morteza Ansarinia
        - Hoorieh Afkari Roshan
        - Pedro Cardoso-Leite
      version: "1.0"
  participants:
    Participant_Subject:
      name: Each subject
      participantMultiplicity:
        minimum: 8
        maximum: 8
      processRef: Example_Study
    Participant_Analysis:
      name: Analysis and report
  messageFlows:
    Msg_Complete:
      name: all subjects complete
      sourceRef: Participant_Subject
      targetRef: Participant_Analysis
      messageRef: Complete
Complete:
  type: Message
Example_Study:
  type: Process
  name: Each subject
  documentation: >-
    One subject, from consent to debriefing; the participant multiplicity of four on the pool makes one instance per
    subject in the cohort, and an exit inside an instance (Excluded_Pre, Discontinued) ends that instance only.
  properties:
    P_Arm:
      name: arm
      value: none
    P_Instruction:
      name: instruction
      value: none
  laneSets:
    LaneSet_Subject:
      lanes:
        Lane_Enrolment:
          name: Enrolment
          flowNodeRef:
            - Enroll
            - Screening
            - Eligibility_Gateway
            - Excluded_Pre
        Lane_Allocation:
          name: Allocation
          flowNodeRef:
            - Randomize_Disposition
            - Allocate_Cautious
            - Allocate_Impulsive
            - Merge_Allocation
        Lane_Followup:
          name: Follow-up
          flowNodeRef:
            - Task_Interference
            - Failed_Interference
            - Task_WorkingMemory
            - Failed_WorkingMemory
            - Discontinued
            - Debrief
            - Sub_End
  flowElements:
    Enroll:
      type: StartEvent
      name: Enrolled and consented
      onset: T0
      consentFormUri: https://behaverse.org/protocols/example-study/consent.md
    Screening:
      type: cognitive:Questionnaire
      name: Assessed for eligibility (n={reached})
      instrument: comprehension-check
      checklist: |-
        - [x] Consent recorded
        - [x] Executor configuration pinned (model id, sampling parameters)
        - [x] Comprehension check passed
      onset: T0
      duration: 10s
    Eligibility_Gateway:
      type: cognitive:EligibilityGateway
      name: Understood the instructions?
      inclusionCriteria:
        - Registered artificial actor family with a pinned model tag
        - Comprehension check answered as instructed
      exclusionCriteria:
        - No answer, or an answer that does not follow the instruction
      default: Flow_Excluded_Pre
    Excluded_Pre:
      type: EndEvent
      name: "Excluded: did not understand the task (n={reached})"
    Randomize_Disposition:
      type: cognitive:RandomGateway
      name: Which disposition? (n={reached})
      algorithm: block
      allocationRatio: "1:1"
      default: Flow_Allocate_Impulsive
    Allocate_Cautious:
      type: ServiceTask
      name: Allocated to cautious disposition (n={reached})
      onset: T0
      duration: 1s
      additionalArguments:
        arm: cautious
        instruction: Take your time on every trial. Answer only when you are sure; accuracy matters more than speed.
      implementation: python://builtins.dict
    Allocate_Impulsive:
      type: ServiceTask
      name: Allocated to impulsive disposition (n={reached})
      onset: T0
      duration: 1s
      additionalArguments:
        arm: impulsive
        instruction: Go with your first impression on every trial. Answer as fast as you can; speed matters more than accuracy.
      implementation: python://builtins.dict
    Merge_Allocation:
      type: ExclusiveGateway
    Task_Interference:
      type: behaverse:Task
      name: Interference control (Simon) (n={reached})
      instrument: WO
      timeline: SimonTask
      onset: T0+20s
      duration: 40s
    Failed_Interference:
      type: BoundaryEvent
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_Interference:
          type: ConditionalEventDefinition
          condition: "{Task_Interference.failedTrialRate} > 0.2"
      attachedToRef: Task_Interference
    Task_WorkingMemory:
      type: behaverse:Task
      name: Working memory (1-back) (n={reached})
      instrument: NB
      timeline: XCIT_NB_01
      onset: T0+60s
      duration: 3min
    Failed_WorkingMemory:
      type: BoundaryEvent
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_WorkingMemory:
          type: ConditionalEventDefinition
          condition: "{Task_WorkingMemory.failedTrialRate} > 0.2"
      attachedToRef: Task_WorkingMemory
    Discontinued:
      type: EndEvent
      name: "Discontinued: more than 20% of trials unanswered (n={reached})"
    Debrief:
      type: cognitive:Instruction
      name: Debrief
      content: The session is over. Thank you for taking part; nothing further is asked of you.
      onset: T0+4min
      duration: 1s
    Sub_End:
      type: EndEvent
      name: Completed the protocol (n={reached})
    SF_Start_Screening: Enroll -> Screening
    SF_Screening_Eligibility: Screening -> Eligibility_Gateway
    Flow_Eligible:
      name: yes (n={reached})
      conditionExpression: "'READY' in (Screening or '').upper()"
      sourceRef: Eligibility_Gateway
      targetRef: Randomize_Disposition
    Flow_Excluded_Pre:
      name: no (n={reached})
      sourceRef: Eligibility_Gateway
      targetRef: Excluded_Pre
    Flow_Allocate_Cautious:
      name: cautious (n={reached})
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Cautious
    Flow_Allocate_Impulsive:
      name: impulsive (n={reached})
      sourceRef: Randomize_Disposition
      targetRef: Allocate_Impulsive
    SF_Cautious_Merge: Allocate_Cautious -> Merge_Allocation
    SF_Impulsive_Merge: Allocate_Impulsive -> Merge_Allocation
    SF_Merge_Interference: Merge_Allocation -> Task_Interference
    SF_Interference_WorkingMemory: Task_Interference -> Task_WorkingMemory
    SF_WorkingMemory_Debrief: Task_WorkingMemory -> Debrief
    SF_Debrief_End: Debrief -> Sub_End
    SF_Failed_Interference: Failed_Interference -> Discontinued
    SF_Failed_WorkingMemory: Failed_WorkingMemory -> Discontinued
