id: example_study_consort
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Example_Study:
  type: Process
  name: Example study, CONSORT participant flow (Figure view after execution)
  documentation: >-
    The example study projected as its CONSORT participant flow: the Figure view of the executed file, with
    the battery and the analysis collapsed. Groups are the four CONSORT phases plus the report. Attrition is
    encoded as boundary error events terminating at counted error end events; every `n` is a run-state value
    the runner wrote as the cohort ran.
  extensionElements:
    - type: studyflow:Study
      seed: 42
      runtime: browser
      version: "1.0"
      authors:
        - Morteza Ansarinia
        - Hoorieh Afkari Roshan
        - Pedro Cardoso-Leite
      dependencies:
        - behaverse-analysis==1.0
        - scikit-learn>=1.5
  properties:
    P_arm:
      name: arm
  flowElements:
    Enroll:
      type: StartEvent
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Enrolled and consented (n={reached})
      consentFormUri: https://behaverse.org/protocols/example-study/consent.md
      onset: T0
      bounds: 382 62 36 36
      label: 426 66 140 27
    Screening:
      type: Task
      font: "#4e6f95"
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Screening
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: screening
      checklist: |-
        - [x] Informed consent recorded
        - [x] Demographic intake
        - [x] Inclusion criteria checked
        - [x] Exclusion criteria checked
      onset: T0
      duration: 5min
      bounds: 330 120 140 65
    Eligibility_Gateway:
      type: ExclusiveGateway
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Assessed for eligibility (n={reached})
      extensionElements:
        - type: cognitive:EligibilityGateway
          inclusionCriteria:
            - Aged 18 to 65 years, normal or corrected-to-normal vision (human cohort)
            - Registered agent family with a pinned model version (artificial cohort)
          exclusionCriteria:
            - Prior exposure to the battery
            - Failed comprehension check at screening
      bounds: 375 215 50 50
      isMarkerVisible: true
      label: 222 226 146 27
    Excluded_Pre:
      type: EndEvent
      name: Excluded (n={count})
      properties:
        P_count_pre: { name: count, value: "0" }
      eventDefinitions:
        Err_ExcludedPre: { type: ErrorEventDefinition }
      bounds: 590 222 36 36
      fill: "#f1d0cd"
      stroke: "#ac5a54"
      label: 632 233 100 14
    Randomize_Gateway:
      type: ExclusiveGateway
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Randomized (n={reached})
      extensionElements:
        - type: cognitive:RandomGateway
          algorithm: block
          allocationRatio: "1:1"
          blockSize: 4
      bounds: 375 330 50 50
      isMarkerVisible: true
      label: 338 378 124 14
    Allocate_Cautious:
      type: Task
      font: "#4e6f95"
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Allocated to cautious disposition (n={reached})
      extensionElements:
        - type: cognitive:Instruction
          content: >-
            Take your time on every trial. Answer only when you are sure; accuracy matters more than speed.
      onset: T0+5min
      duration: 1min
      bounds: 220 405 170 80
    DidNotStart_Cautious:
      type: BoundaryEvent
      fill: "#eef3f8"
      stroke: "#4e6f95"
      name: Did not receive allocated intervention
      eventDefinitions:
        Err_DNS_Cautious: { type: ErrorEventDefinition }
      attachedToRef: Allocate_Cautious
      bounds: 232 467 36 36
      label: 160 507 84 40
    Allocate_Impulsive:
      type: Task
      font: "#4e6f95"
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      name: Allocated to impulsive disposition (n={reached})
      extensionElements:
        - type: cognitive:Instruction
          content: >-
            Go with your first impression on every trial. Answer as fast as you can; speed matters more than accuracy.
      onset: T0+5min
      duration: 1min
      bounds: 410 405 170 80
    DidNotStart_Impulsive:
      type: BoundaryEvent
      fill: "#eef3f8"
      stroke: "#4e6f95"
      name: Did not receive allocated intervention
      eventDefinitions:
        Err_DNS_Impulsive: { type: ErrorEventDefinition }
      attachedToRef: Allocate_Impulsive
      bounds: 542 467 36 36
      label: 570 507 106 40
    Merge_Allocation:
      type: ExclusiveGateway
      fill: "#dbe6f2"
      stroke: "#4e6f95"
      bounds: 375 510 50 50
    DidNotStart:
      type: EndEvent
      name: Did not receive allocated intervention (n={count})
      properties:
        P_count_dns: { name: count, value: "0" }
      eventDefinitions:
        Err_DidNotStart: { type: ErrorEventDefinition }
      bounds: 590 552 36 36
      fill: "#f1d0cd"
      stroke: "#ac5a54"
      label: 632 552 108 54
    Battery:
      type: SubProcess
      font: "#5c8a55"
      fill: "#dcebd6"
      stroke: "#5c8a55"
      name: Cognitive battery (n={reached})
      properties:
        P_failed_trials: { name: failed_trials, value: "0" }
      onset: T0+6min
      duration: 30min
      bounds: 330 640 140 70
      isExpanded: false
    Battery_Error:
      type: BoundaryEvent
      fill: "#f0f6ee"
      stroke: "#5c8a55"
      name: failed-trial rate above 20%
      eventDefinitions:
        Err_BatteryExit: { type: ErrorEventDefinition }
      attachedToRef: Battery
      bounds: 452 692 36 36
      label: 490 678 96 27
    Discontinued:
      type: EndEvent
      name: Discontinued intervention (n={count})
      properties:
        P_count_disc: { name: count, value: "0" }
      eventDefinitions:
        Err_Discontinued: { type: ErrorEventDefinition }
      bounds: 590 692 36 36
      fill: "#f1d0cd"
      stroke: "#ac5a54"
      label: 632 692 108 27
    Analysis:
      type: SubProcess
      font: "#7a67a6"
      extensionElements:
        - type: prov:Activity
          action: executed
          when: "2026-09-01T14:58:00Z"
          run: 2026-09-01/example_study
          seed: 42
        - type: prov:Activity
          action: invalidated
          when: "2026-09-03T09:30:00Z"
          who: Morteza Ansarinia
          with: studyflow-modeler/26.9.24
          what: "2026-09-01T14:58:00Z"
        - type: prov:Activity
          action: executed
          when: "2026-09-03T09:52:00Z"
          run: 2026-09-03/example_study
          seed: 42
      fill: "#e6dff1"
      stroke: "#7a67a6"
      name: Analysis pipeline, preregistered (n={reached})
      onset: T0+40min
      duration: 10min
      bounds: 330 770 140 70
      isExpanded: false
    Analysis_Error:
      type: BoundaryEvent
      fill: "#f4f1f8"
      stroke: "#7a67a6"
      name: fewer than 50% valid trials
      eventDefinitions:
        Err_AnalysisExit: { type: ErrorEventDefinition }
      attachedToRef: Analysis
      bounds: 452 822 36 36
      label: 490 808 96 27
    Excluded_Analysis:
      type: EndEvent
      name: Excluded from analysis (n={count})
      properties:
        P_count_excl: { name: count, value: "0" }
      eventDefinitions:
        Err_ExcludedAnalysis: { type: ErrorEventDefinition }
      bounds: 590 822 36 36
      fill: "#f1d0cd"
      stroke: "#ac5a54"
      label: 632 827 108 40
    Render:
      type: ServiceTask
      font: "#a2803c"
      fill: "#f6e8c9"
      stroke: "#a2803c"
      name: Render reporting artifacts
      implementation: python://behaverse_report.render@1.0
      onset: T0+50min
      duration: 2min
      bounds: 330 900 150 70
    Debrief:
      type: Task
      font: "#a2803c"
      fill: "#f6e8c9"
      stroke: "#a2803c"
      name: Debrief
      extensionElements:
        - type: cognitive:Instruction
          content: Thank you for taking part. Your completion code follows on the next page.
      onset: T0+52min
      duration: 1min
      bounds: 500 900 100 70
    Completed:
      type: EndEvent
      fill: "#f6e8c9"
      stroke: "#a2803c"
      name: Completed (n={reached})
      redirectTo: https://app.prolific.com/submissions/complete?cc={COMPLETION_CODE}
      completionCodeType: dynamic
      bounds: 630 917 36 36
    Flow_Enroll_Screening:
      sourceRef: Enroll
      targetRef: Screening
      stroke: "#4e6f95"
    Flow_Screening_Eligibility:
      sourceRef: Screening
      targetRef: Eligibility_Gateway
      stroke: "#4e6f95"
    Flow_Eligible:
      stroke: "#4e6f95"
      name: eligible
      sourceRef: Eligibility_Gateway
      targetRef: Randomize_Gateway
      label: 406 278 56 14
      waypoint: 400,265 400,330
    Flow_Excluded_Pre:
      name: not eligible
      sourceRef: Eligibility_Gateway
      targetRef: Excluded_Pre
      stroke: "#ac5a54"
      waypoint: 425,240 590,240
      label: 466 222 84 14
    Flow_Allocate_Cautious:
      stroke: "#4e6f95"
      name: cautious
      sourceRef: Randomize_Gateway
      targetRef: Allocate_Cautious
      waypoint: 375,355 305,355 305,405
      label: 246 337 60 14
    Flow_Allocate_Impulsive:
      stroke: "#4e6f95"
      name: impulsive
      sourceRef: Randomize_Gateway
      targetRef: Allocate_Impulsive
      waypoint: 425,355 495,355 495,405
      label: 430 337 66 14
    Flow_Cautious_Merge:
      stroke: "#4e6f95"
      sourceRef: Allocate_Cautious
      targetRef: Merge_Allocation
      waypoint: 305,485 305,535 375,535
    Flow_Impulsive_Merge:
      stroke: "#4e6f95"
      sourceRef: Allocate_Impulsive
      targetRef: Merge_Allocation
      waypoint: 495,485 495,535 425,535
    Flow_DNS_Cautious:
      sourceRef: DidNotStart_Cautious
      targetRef: DidNotStart
      waypoint: 250,503 250,570 590,570
      stroke: "#ac5a54"
    Flow_DNS_Impulsive:
      sourceRef: DidNotStart_Impulsive
      targetRef: DidNotStart
      waypoint: 560,503 560,570 590,570
      stroke: "#ac5a54"
    Flow_Merge_Battery:
      stroke: "#4e6f95"
      sourceRef: Merge_Allocation
      targetRef: Battery
      waypoint: 400,560 400,640
    Flow_Battery_Discontinued:
      sourceRef: Battery_Error
      targetRef: Discontinued
      waypoint: 488,710 590,710
      stroke: "#ac5a54"
    Flow_Battery_Analysis:
      stroke: "#5c8a55"
      sourceRef: Battery
      targetRef: Analysis
      waypoint: 400,710 400,770
    Flow_Analysis_Excluded:
      sourceRef: Analysis_Error
      targetRef: Excluded_Analysis
      waypoint: 488,840 590,840
      stroke: "#ac5a54"
    Flow_Analysis_Render:
      stroke: "#7a67a6"
      sourceRef: Analysis
      targetRef: Render
      waypoint: 400,840 400,900
    Flow_Render_Debrief:
      stroke: "#a2803c"
      sourceRef: Render
      targetRef: Debrief
      waypoint: 480,935 500,935
    Flow_Debrief_Completed:
      stroke: "#a2803c"
      sourceRef: Debrief
      targetRef: Completed
      waypoint: 600,935 630,935
  artifacts:
    Group_Enrolment:
      type: Group
      categoryValueRef: CV_Enrolment
      bounds: 160 40 580 260
    Group_Allocation:
      type: Group
      categoryValueRef: CV_Allocation
      bounds: 160 310 580 300
    Group_Followup:
      type: Group
      categoryValueRef: CV_Followup
      bounds: 160 620 580 120
    Group_Analysis:
      type: Group
      categoryValueRef: CV_Analysis
      bounds: 160 750 580 120
    Group_Report:
      type: Group
      categoryValueRef: CV_Report
      bounds: 160 880 580 120
Category_Enrolment:
  type: Category
  categoryValue:
    CV_Enrolment:
      value: Enrolment
Category_Allocation:
  type: Category
  categoryValue:
    CV_Allocation:
      value: Allocation
Category_Followup:
  type: Category
  categoryValue:
    CV_Followup:
      value: Follow-up
Category_Analysis:
  type: Category
  categoryValue:
    CV_Analysis:
      value: Analysis
Category_Report:
  type: Category
  categoryValue:
    CV_Report:
      value: Report
state:
  _meta:
    prov:
      - action: created
        when: "2026-08-01T09:00:00Z"
        who: Morteza Ansarinia
        with: studyflow-modeler/26.9.5
      - action: executed
        when: "2026-08-20T10:05:00Z"
        with: studyflow-cli/26.9.18
        seed: 7
        run: 2026-08-20/pilot_random
      - action: executed
        when: "2026-09-01T14:20:00Z"
        with: studyflow-cli/26.9.24
        seed: 42
        run: 2026-09-01/example_study
      - action: executed
        when: "2026-09-03T09:41:00Z"
        with: studyflow-cli/26.9.24
        seed: 42
        run: 2026-09-03/example_study
    reached:
      Enroll: 96
      Eligibility_Gateway: 96
      Randomize_Gateway: 90
      Allocate_Cautious: 45
      Allocate_Impulsive: 45
      Battery: 88
      Analysis: 79
      Completed: 76
  Excluded_Pre: { count: 6 }
  DidNotStart: { count: 2 }
  Discontinued: { count: 9 }
  Excluded_Analysis: { count: 3 }
