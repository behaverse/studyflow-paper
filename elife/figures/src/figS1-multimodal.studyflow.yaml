id: figS1_multimodal
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Multimodal_Pipeline:
  type: studyflow:Study
  name: Multimodal preprocessing and training
  documentation: >-
    Figure S1: a use-case pipeline harmonizing EEG, fMRI, and behavioral recordings. Three source datasets feed
    modality-specific preprocessing (EEGPrep, fMRIPrep, BDM conversion), the three at once between a parallel split and
    its join; a compose/expansion step then produces a harmonized corpus, then a model is trained on its training split
    and evaluated on its test split. The implementations are illustrative references, not packages a run installs.
  flowElements:
    Start:
      type: StartEvent
    eeg_raw:
      type: eeg:BIDSDataset
      name: EEG (BIDS)
      dataType: eeg
    fmri_raw:
      type: eeg:BIDSDataset
      name: fMRI (BIDS)
      dataType: func
    beh_raw:
      type: behaverse:BDMDataset
      name: Behavior (BDM)
    EEGPrep:
      type: ServiceTask
      name: EEGPrep
      documentation: Filters, cleans, and normalizes BIDS EEG data (EEGLAB clean_rawdata, ASR, ICA + ICLabel).
      icon: iconify ph--wave-sine
      dataInputAssociations:
        da_eeg:
          sourceRef:
            - eeg_raw
      implementation: docker://sccn/eegprep
    fMRIPrep:
      type: ServiceTask
      name: fMRIPrep
      documentation: Preprocesses BIDS fMRI data into normalized, denoised images.
      icon: iconify ph--brain
      dataInputAssociations:
        da_fmri:
          sourceRef:
            - fmri_raw
      implementation: docker://nipreps/fmriprep:23.2.0
    BehConv:
      type: ServiceTask
      name: BDM conversion
      dataInputAssociations:
        da_beh:
          sourceRef:
            - beh_raw
      implementation: python://behaverse.to_bdm@1.0
    Compose:
      type: ServiceTask
      name: Compose (multiverse)
      dataOutputAssociations:
        da_harm:
          targetRef: harmonized
      implementation: python://omniprocess.compose@1.0
    harmonized:
      type: behaverse:BDMDataset
      name: Harmonized corpus
      dataLevel: models
    Train:
      type: ServiceTask
      name: Train on the training split
      implementation: python://models.train@1.0
    Evaluate:
      type: ServiceTask
      name: Evaluate on the test split
      implementation: python://models.evaluate@1.0
    Done:
      type: EndEvent
      name: Done
    Split:
      type: ParallelGateway
    Join:
      type: ParallelGateway
    m0: Start -> Split
    s1: Split -> EEGPrep
    s2: Split -> fMRIPrep
    s3: Split -> BehConv
    j1: EEGPrep -> Join
    j2: fMRIPrep -> Join
    j3: BehConv -> Join
    m3: Join -> Compose
    m4: Compose -> Train
    m7: Train -> Evaluate
    m8: Evaluate -> Done
