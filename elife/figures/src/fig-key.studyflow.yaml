id: fig_key
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
Key:
  type: Process
  name: Symbols used in the combined study figure
  documentation: >-
    The one-row symbol key composed under @fig-combined: eight symbols, each with its plain-language name. Nothing here
    executes; it is a legend, not a fragment of the study. `render.sh` draws it at the same scale as @fig-combined and
    `compose_key.py` pastes it under the diagram, so the names print at the size of the figure's own labels. The last
    symbol is the three-bar parallel marker a pool carries when it runs several instances of its process, which is how
    the cohort of eight subjects is written; on the pool itself it sits at the foot of the title band with the instance
    count, `×8`, under it, and here it rides a plain box, because a pool draws its name up its band and so could not
    carry this caption. The caption carries the two symbols left out for width: `+` marks a sub-process expanded in
    another figure, and dashed arrows crossing the pool boundary are messages to the model.
  flowElements:
    K_Start:
      type: StartEvent
      name: start
    K_Task:
      type: Task
      name: a step
    K_Gateway:
      type: ExclusiveGateway
      name: a decision
    K_Exit:
      type: EndEvent
      name: an exit
    K_Data:
      type: DataObjectReference
      name: data a step reads or writes
    K_Store:
      type: DataStoreReference
      name: a dataset
    K_Boundary_Task:
      type: Task
    K_Boundary:
      type: BoundaryEvent
      name: an exit rule (boundary event)
      eventDefinitions:
        Cond_Key:
          type: ConditionalEventDefinition
          condition: "{K_Boundary_Task.failedTrialRate} > 0.2"
      attachedToRef: K_Boundary_Task
    K_Parallel:
      type: Task
      name: a pool, run once per subject
      loopCharacteristics:
        type: MultiInstanceLoopCharacteristics
        loopCardinality: "4"
