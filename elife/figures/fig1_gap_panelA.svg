<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" version="1.1" role="img">
<title>Figure 1, Panel A (sketch) — one process, many disconnected artifacts</title>
<desc>Four study stages (Design, Run, Analyze, Report) each produce artifact chips; dashed arrows show humans re-typing content between artifacts; one exclusion rule drifts across three copies; tool coverage bars each span one slice, and a dashed empty bar shows that no tool spans the whole lifecycle.</desc>
<defs>
<marker id="mdark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="mred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Helvetica,Arial,sans-serif">

<text x="40" y="24" font-size="14" font-weight="600" fill="#27272A">Panel A &#183; one process, many disconnected artifacts</text>

<!-- lifecycle stages -->
<rect x="40" y="44" width="120" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="100" y="65" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Design</text>
<rect x="195" y="44" width="120" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="255" y="65" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Run</text>
<rect x="350" y="44" width="120" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="410" y="65" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Analyze</text>
<rect x="505" y="44" width="120" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="565" y="65" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Report</text>
<line x1="162" y1="61" x2="189" y2="61" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#mdark)"/>
<line x1="317" y1="61" x2="344" y2="61" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#mdark)"/>
<line x1="472" y1="61" x2="499" y2="61" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#mdark)"/>

<!-- each stage produces its artifacts -->
<line x1="100" y1="78" x2="100" y2="89" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#mdark)"/>
<line x1="255" y1="78" x2="255" y2="89" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#mdark)"/>
<line x1="410" y1="78" x2="410" y2="89" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#mdark)"/>
<line x1="565" y1="78" x2="565" y2="89" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#mdark)"/>

<!-- Design artifacts -->
<rect x="40" y="96" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="100" y="111" font-size="12" fill="#5F5E5A" text-anchor="middle">Consent form</text>
<g opacity="0.55">
<rect x="40" y="124" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="100" y="139" font-size="12" fill="#5F5E5A" text-anchor="middle">Ethics approval</text>
</g>
<g opacity="0.55">
<rect x="40" y="152" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="100" y="167" font-size="12" fill="#5F5E5A" text-anchor="middle">Prereg entry</text>
</g>
<rect x="40" y="180" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="100" y="195" font-size="12" fill="#5F5E5A" text-anchor="middle">Protocol PDF</text>

<!-- Run artifacts -->
<rect x="195" y="96" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="255" y="111" font-size="12" fill="#5F5E5A" text-anchor="middle">Session logs</text>
<rect x="195" y="124" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="255" y="139" font-size="12" fill="#5F5E5A" text-anchor="middle">Raw trial data</text>
<rect x="195" y="152" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="255" y="167" font-size="12" fill="#5F5E5A" text-anchor="middle">Task script</text>

<!-- Analyze artifacts -->
<rect x="350" y="96" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="410" y="111" font-size="12" fill="#5F5E5A" text-anchor="middle">Exclusion counts</text>
<rect x="350" y="124" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="410" y="139" font-size="12" fill="#5F5E5A" text-anchor="middle">Derived data</text>
<rect x="350" y="152" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="410" y="167" font-size="12" fill="#5F5E5A" text-anchor="middle">Analysis code</text>

<!-- Report artifacts -->
<rect x="505" y="96" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="565" y="111" font-size="12" fill="#5F5E5A" text-anchor="middle">Checklist</text>
<rect x="505" y="124" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="565" y="139" font-size="12" fill="#5F5E5A" text-anchor="middle">CONSORT figure</text>
<rect x="505" y="152" width="120" height="22" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="565" y="167" font-size="12" fill="#5F5E5A" text-anchor="middle">Manuscript</text>

<!-- dead ends: produced, never machine-read again -->
<line x1="162" y1="135" x2="176" y2="135" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="176" y1="130" x2="176" y2="140" stroke="#888780" stroke-width="1"/>
<line x1="162" y1="163" x2="176" y2="163" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="176" y1="158" x2="176" y2="168" stroke="#888780" stroke-width="1"/>

<!-- consumption = human re-reads and re-types -->
<line x1="162" y1="191" x2="190" y2="165" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mgray)"/>
<line x1="317" y1="135" x2="345" y2="161" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mgray)"/>
<line x1="472" y1="107" x2="500" y2="133" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mgray)"/>
<line x1="472" y1="135" x2="500" y2="161" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mgray)"/>

<!-- the same rule, three drifting copies -->
<line x1="100" y1="202" x2="100" y2="211" stroke="#E24B4A" stroke-width="0.75" stroke-dasharray="2 2"/>
<line x1="410" y1="174" x2="410" y2="211" stroke="#E24B4A" stroke-width="0.75" stroke-dasharray="2 2"/>
<line x1="565" y1="174" x2="565" y2="211" stroke="#E24B4A" stroke-width="0.75" stroke-dasharray="2 2"/>
<rect x="72" y="212" width="56" height="18" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="100" y="225" font-size="12" fill="#791F1F" text-anchor="middle">&gt;20 %</text>
<rect x="382" y="212" width="56" height="18" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="410" y="225" font-size="12" fill="#791F1F" text-anchor="middle">0.25</text>
<rect x="537" y="212" width="56" height="18" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.75"/>
<text x="565" y="225" font-size="12" fill="#791F1F" text-anchor="middle">25 %</text>
<line x1="132" y1="221" x2="377" y2="221" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mred)"/>
<line x1="442" y1="221" x2="532" y2="221" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mred)"/>

<!-- tool family coverage -->
<text x="40" y="250" font-size="12" fill="#5F5E5A">What existing tools cover:</text>
<rect x="185" y="256" width="145" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="257" y="268" font-size="12" fill="#085041" text-anchor="middle">Experiment builders</text>
<rect x="345" y="256" width="145" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="417" y="268" font-size="12" fill="#085041" text-anchor="middle">Engines &amp; harnesses</text>
<rect x="40" y="278" width="120" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="100" y="290" font-size="12" fill="#085041" text-anchor="middle">Guidelines</text>
<rect x="270" y="278" width="130" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="335" y="290" font-size="12" fill="#085041" text-anchor="middle">Data standards</text>
<rect x="505" y="278" width="120" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="565" y="290" font-size="12" fill="#085041" text-anchor="middle">Guidelines</text>

<!-- the gap -->
<rect x="40" y="310" width="585" height="20" rx="4" fill="none" stroke="#E24B4A" stroke-dasharray="5 4"/>
<text x="332" y="324" font-size="12" fill="#A32D2D" text-anchor="middle">no tool spans the whole lifecycle &#8212; the gap</text>

<!-- legend -->
<line x1="40" y1="348" x2="64" y2="348" stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mgray)"/>
<text x="72" y="352" font-size="12" fill="#5F5E5A">human re-reads &amp; re-types</text>
<line x1="248" y1="348" x2="260" y2="348" stroke="#888780" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="260" y1="343" x2="260" y2="353" stroke="#888780" stroke-width="1"/>
<text x="270" y="352" font-size="12" fill="#5F5E5A">never read again</text>
<line x1="388" y1="348" x2="412" y2="348" stroke="#E24B4A" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mred)"/>
<text x="420" y="352" font-size="12" fill="#5F5E5A">one rule, three drifting copies</text>

</g>
</svg>
