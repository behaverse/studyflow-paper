<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" version="1.1"><rect x="6" y="6" width="788" height="348" rx="14" fill="#f4f4f5" stroke="#a1a1aa" stroke-width="2" stroke-dasharray="10 8"/><rect x="34" y="30" width="150" height="30" rx="15" fill="#e4e4e7" stroke="#a1a1aa" stroke-width="1"/><text x="109" y="50" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#3f3f46">TODO · FIGURE</text><text x="400" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#27272a">Figure placeholder — to be finalized</text><text x="400" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#52525b">“Many artifacts, one study.” A study's lifecycle</text><text x="400" y="184" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#52525b">(design → run → analyze → report) passes through</text><text x="400" y="216" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#52525b">many hands, each holding a different document;</text><text x="400" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#52525b">existing tools each cover only one slice, leaving</text><text x="400" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#52525b">no shared machine-readable artifact spanning all four.</text></svg>