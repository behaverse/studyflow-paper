<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" version="1.1" role="img">
<title>Figure 1, Panel B (sketch) — where existing approaches sit, and the gap</title>
<desc>A two-axis map: definition versus execution on the horizontal axis, domain-generic versus domain-specific on the vertical. BPMN and workflow engines sit in the generic band; reporting guidelines, data standards, and experiment builders in the specific band. Small squares under each show which lifecycle stages it covers. A dashed red pill spans the full definition-to-execution width with all four stages covered: the gap.</desc>
<defs>
<marker id="mgray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g font-family="Helvetica,Arial,sans-serif">

<text x="40" y="24" font-size="14" font-weight="600" fill="#27272A">Panel B &#183; where existing approaches sit &#8212; and the gap</text>

<!-- plot frame and quadrant midlines -->
<rect x="150" y="56" width="450" height="274" fill="none" stroke="#D3D1C7" stroke-width="0.75"/>
<line x1="150" y1="170" x2="600" y2="170" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<line x1="375" y1="56" x2="375" y2="288" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>

<!-- axes -->
<text x="40" y="100" font-size="12" fill="#5F5E5A">domain-generic</text>
<text x="40" y="240" font-size="12" fill="#5F5E5A">domain-specific</text>
<line x1="140" y1="64" x2="140" y2="324" stroke="#888780" stroke-width="1" marker-start="url(#mgray)" marker-end="url(#mgray)"/>
<text x="150" y="352" font-size="12" fill="#5F5E5A">definition</text>
<text x="600" y="352" font-size="12" fill="#5F5E5A" text-anchor="end">execution</text>
<line x1="230" y1="348" x2="520" y2="348" stroke="#888780" stroke-width="1" marker-start="url(#mgray)" marker-end="url(#mgray)"/>

<!-- generic band -->
<rect x="200" y="78" width="100" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="212" y="96" font-size="14" font-weight="500" fill="#085041">BPMN 2.0</text>
<rect x="212" y="104" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="226" y="104" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="240" y="104" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="254" y="104" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>

<rect x="410" y="78" width="160" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="422" y="96" font-size="14" font-weight="500" fill="#085041">Workflow engines</text>
<rect x="422" y="104" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="436" y="104" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="450" y="104" width="9" height="9" fill="#1D9E75"/>
<rect x="464" y="104" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>

<!-- specific band -->
<rect x="170" y="186" width="180" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="182" y="204" font-size="14" font-weight="500" fill="#085041">Reporting guidelines</text>
<rect x="182" y="212" width="9" height="9" fill="#1D9E75"/>
<rect x="196" y="212" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="210" y="212" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="224" y="212" width="9" height="9" fill="#1D9E75"/>

<rect x="170" y="240" width="130" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="182" y="258" font-size="14" font-weight="500" fill="#085041">Data standards</text>
<rect x="182" y="266" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="196" y="266" width="9" height="9" fill="#1D9E75"/>
<rect x="210" y="266" width="9" height="9" fill="#1D9E75"/>
<rect x="224" y="266" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>

<rect x="410" y="186" width="170" height="44" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="422" y="204" font-size="14" font-weight="500" fill="#085041">Experiment builders</text>
<rect x="422" y="212" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="436" y="212" width="9" height="9" fill="#1D9E75"/>
<rect x="450" y="212" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>
<rect x="464" y="212" width="9" height="9" fill="none" stroke="#1D9E75" stroke-width="0.75"/>

<!-- the gap -->
<rect x="170" y="294" width="410" height="28" rx="14" fill="none" stroke="#E24B4A" stroke-dasharray="5 4"/>
<text x="345" y="313" font-size="12" fill="#A32D2D" text-anchor="middle">the gap: readable + executable, whole study</text>
<rect x="498" y="303" width="9" height="9" fill="#E24B4A"/>
<rect x="512" y="303" width="9" height="9" fill="#E24B4A"/>
<rect x="526" y="303" width="9" height="9" fill="#E24B4A"/>
<rect x="540" y="303" width="9" height="9" fill="#E24B4A"/>

<!-- legend -->
<text x="40" y="380" font-size="12" fill="#5F5E5A">&#9633; = lifecycle coverage, in order: Design &#183; Run &#183; Analyze &#183; Report &#8212; filled = covered</text>

</g>
</svg>
