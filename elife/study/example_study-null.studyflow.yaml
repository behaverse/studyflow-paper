id: example_study
definitions:
  targetNamespace: http://bpmn.io/schema/bpmn
  xmlns:bpmn2: http://www.omg.org/spec/BPMN/20100524/MODEL
Example_Study_Collaboration:
  type: Collaboration
  documentation: >-
    The paper's example study as one executable Studyflow file: the deposited plan, before any run. Three pools, one
    level of containers each. The middle pool is one subject, and its three lanes are the CONSORT participant flow:
    Enrolment, Allocation, Follow-up, each a band the flow crosses on its way down, with the exits at the right edge of
    the band they leave from. Labels are the study's own words rather than BPMN's: a gateway asks a question and its
    flows are the answers, an exit says why the subject left, and @fig-key names each symbol. The subjects' pool carries
    a participant multiplicity of eight, so the cohort is eight instances of that pool's process, one per subject; BPMN
    draws the parallel marker at the pool's bottom. The cohort is one actor, whoever the pool's `implementation` names:
    `simulate://planted`, a simulated participant with a planted effect, in this file, and a language model served by a
    local Ollama (`ollama://…`) in its sealed twins, which differ from it in that one line. The whole exchange with it
    crosses the pool boundary as one pair of message flows at pool level: one `behaverse:Trial` out per trial and one
    `behaverse:Response` back, inherited by whichever task is playing. @fig-step2-run draws the same exchange per task.
    Labels cite `{reached}`, which the runner fills in as the cohort runs, so the executed copy of this file is the
    CONSORT participant flow of the study as executed.
  extensionElements:
    - type: studyflow:Study
      seed: 42
      dependencies:
        - pandas==2.3.3
        - scipy==1.16.2
        - scikit-learn==1.7.2
        - matplotlib==3.10.7
      authors:
        - Morteza Ansarinia
        - Hoorieh Afkari Roshan
        - Pedro Cardoso-Leite
      version: "1.0"
  name: Example study (cognitive benchmark, artificial cohort)
  participants:
    Participant_Model:
      extensionElements:
        - type: studyflow:Actor
          implementation: simulate://null
      name: Actor
      bounds: 8 0 932 168
      isHorizontal: true
      fill: "#f5f5f4"
    Participant_Subject:
      name: Each subject
      participantMultiplicity:
        minimum: 8
        maximum: 8
      processRef: Example_Study
      bounds: 8 216 932 694
      isHorizontal: true
    Participant_Analysis:
      name: Analysis and report
      processRef: Analysis_Report
      bounds: 8 994 932 148
      isHorizontal: true
  messageFlows:
    Msg_Trial:
      name: each trial
      sourceRef: Participant_Subject
      targetRef: Participant_Model
      messageRef: Trial
      waypoint: 380,216 380,168
      label: 288 178 88 14
      stroke: "#5c8a55"
    Msg_Response:
      name: each response
      sourceRef: Participant_Model
      targetRef: Participant_Subject
      messageRef: Response
      waypoint: 460,168 460,216
      label: 468 178 96 14
      stroke: "#5c8a55"
    Msg_Complete:
      name: all subjects complete
      sourceRef: Participant_Subject
      targetRef: All_Complete
      messageRef: Complete
      waypoint: 108,910 108,1019
      label: 116 940 130 14
      stroke: "#7a67a6"
Trial:
  type: Message
  itemRef: Trial_Item
Response:
  type: Message
  itemRef: Response_Item
Complete:
  type: Message
Trial_Item:
  type: ItemDefinition
  structureRef: behaverse:Trial
Response_Item:
  type: ItemDefinition
  structureRef: behaverse:Response
Example_Study:
  type: Process
  documentation: >-
    One subject, from consent to debriefing, and the pool is the boundary of that system. The participant multiplicity
    of eight on the pool makes eight instances of this process, one per subject in the cohort; they do not depend on one
    another, which is why this is a multiplicity and not a loop. `arm` is a property of this process, so each instance
    draws and carries its own disposition, and the runtime stamps every recorded trial with the pool's instance index as
    `context.subject`, so nothing in the diagram has to number subjects. An exit inside an instance (Excluded_Pre,
    Discontinued) ends that instance only. The pool is divided into the three CONSORT phases a participant passes
    through, and into nothing else: a lane is a band of the drawing, so the flow crosses it without waiting.
  name: Each subject
  properties:
    P_Arm:
      name: arm
      value: none
    P_Instruction:
      name: instruction
      value: none
  laneSets:
    LaneSet_Subject:
      lanes:
        Lane_Enrolment:
          name: Enrolment
          flowNodeRef:
            - Enroll
            - Screening
            - Eligibility_Gateway
            - Excluded_Pre
          bounds: 38 216 902 160
          font: "#5c8a55"
          fill: "#f0f6ee"
          stroke: "#5c8a55"
        Lane_Allocation:
          name: Allocation
          flowNodeRef:
            - Randomize_Disposition
            - Allocate_Cautious
            - Allocate_Impulsive
            - Merge_Allocation
          bounds: 38 376 902 212
          font: "#5c8a55"
          fill: "#f0f6ee"
          stroke: "#5c8a55"
        Lane_Followup:
          name: Follow-up
          flowNodeRef:
            - Task_Interference
            - Failed_Interference
            - Task_WorkingMemory
            - Failed_WorkingMemory
            - Discontinued
            - Debrief
            - Sub_End
          bounds: 38 588 902 322
          font: "#5c8a55"
          fill: "#f0f6ee"
          stroke: "#5c8a55"
  flowElements:
    Enroll:
      type: StartEvent
      name: Enrolled and consented
      onset: T0
      consentFormUri: https://behaverse.org/protocols/example-study/consent.md
      bounds: 100 260 36 36
      label: 70 300 96 28
      fill: "#dbe6f2"
      stroke: "#4e6f95"
    Screening:
      type: Task
      documentation: >-
        The screening step asks the actor the comprehension check wired into it and takes the answer as its result; the
        eligibility gateway tests that answer.
      checklist: |-
        - [ ] Consent recorded
        - [ ] Executor configuration pinned (model id, sampling parameters)
        - [ ] Comprehension check passed
      extensionElements:
        - type: cognitive:Questionnaire
          instrument: comprehension-check
      name: Assessed for eligibility (n={reached})
      dataInputAssociations:
        In_Check:
          sourceRef:
            - Prompt_Check
          waypoint: 208,318 208,311
          stroke: "#4e6f95"
      onset: T0
      duration: 10s
      bounds: 190 245 130 66
      font: "#4e6f95"
      fill: "#dbe6f2"
      stroke: "#4e6f95"
    Prompt_Check:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are about to take part in a short cognitive study. Each trial arrives as JSON and lists the
            answers the task accepts under ResponseOptions; you answer with exactly one of them and nothing
            else.

            To confirm you have understood, reply now with exactly the single word READY.
      name: Comprehension check
      bounds: 190 318 36 50
      label: 232 330 96 27
      fill: "#eef3f8"
      stroke: "#4e6f95"
    Eligibility_Gateway:
      type: ExclusiveGateway
      extensionElements:
        - type: cognitive:EligibilityGateway
          inclusionCriteria:
            - Registered artificial actor family with a pinned model tag
            - Comprehension check answered as instructed
          exclusionCriteria:
            - No answer, or an answer that does not follow the instruction
      name: Understood the instructions?
      default: Flow_Excluded_Pre
      bounds: 360 253 50 50
      isMarkerVisible: true
      label: 315 222 140 24
      fill: "#dbe6f2"
      stroke: "#4e6f95"
    Excluded_Pre:
      type: EndEvent
      name: "Excluded: did not understand the task (n={reached})"
      bounds: 840 260 36 36
      label: 763 300 154 30
      fill: "#f1d0cd"
      stroke: "#ac5a54"
    Randomize_Disposition:
      type: ExclusiveGateway
      extensionElements:
        - type: cognitive:RandomGateway
          algorithm: block
          allocationRatio: "1:1"
      name: Which disposition? (n={reached})
      default: Flow_Allocate_Impulsive
      bounds: 360 388 50 50
      isMarkerVisible: true
      label: 130 394 130 40
      fill: "#dbe6f2"
      stroke: "#4e6f95"
    Allocate_Cautious:
      type: ServiceTask
      documentation: >-
        The allocation writes the arm's label into the subject's `arm` property and the instruction that arm receives
        into `instruction`, through the drawn data edges. The battery's prompt cites the instruction as `{instruction}`;
        the label is what the recorded trials and the analysis carry. The step's implementation is `dict`, so the values
        a reader sees in the file are the values the subject gets.
      name: Allocated to cautious disposition (n={reached})
      dataOutputAssociations:
        Out_Arm_Cautious:
          targetRef: P_Arm
          transformation: result.arm
        Out_Instruction_Cautious:
          targetRef: P_Instruction
          transformation: result.instruction
      onset: T0
      duration: 1s
      additionalArguments:
        arm: cautious
        instruction: Take your time on every trial. Answer only when you are sure; accuracy matters more than speed.
      implementation: python://builtins.dict
      bounds: 190 452 190 62
      font: "#4e6f95"
      fill: "#dbe6f2"
      stroke: "#4e6f95"
    Allocate_Impulsive:
      type: ServiceTask
      documentation: The other arm, written into the same two properties by the same mechanism.
      name: Allocated to impulsive disposition (n={reached})
      dataOutputAssociations:
        Out_Arm_Impulsive:
          targetRef: P_Arm
          transformation: result.arm
        Out_Instruction_Impulsive:
          targetRef: P_Instruction
          transformation: result.instruction
      onset: T0
      duration: 1s
      additionalArguments:
        arm: impulsive
        instruction: Go with your first impression on every trial. Answer as fast as you can; speed matters more than accuracy.
      implementation: python://builtins.dict
      bounds: 470 452 190 62
      font: "#4e6f95"
      fill: "#dbe6f2"
      stroke: "#4e6f95"
    Merge_Allocation:
      type: ExclusiveGateway
      bounds: 360 526 50 50
      fill: "#dbe6f2"
      stroke: "#4e6f95"
    Prompt_Battery:
      type: DataObjectReference
      extensionElements:
        - type: agentic:Prompt
          template: |
            You are taking a computerised cognitive test one trial at a time. Each message is one trial, as
            JSON, beside the instruction you were given for the whole test. Answer with one of the strings in
            the trial's ResponseOptions, copied exactly and with nothing else; any other reply is a lost trial.
            The trial's Rule says which option is right for what it shows.
      name: Battery prompt
      bounds: 500 602 36 50
      label: 542 608 96 27
      fill: "#f0f6ee"
      stroke: "#5c8a55"
    Task_Interference:
      type: SubProcess
      documentation: >-
        A Simon task drawn in the notation: its timeline (30 trials, half congruent, a coloured square on one side,
        answered by its colour), one pass per trial asking the actor, and the record of every trial. Nothing outside the
        diagram presents it, so any actor that answers the pool's messages can take it.
      name: Interference control (Simon)
      dataInputAssociations:
        In_Prompt_Task_Interference:
          sourceRef:
            - Prompt_Battery
          waypoint: 500,627 440,627 440,678
          stroke: "#5c8a55"
      dataOutputAssociations:
        Out_Trials_Task_Interference:
          targetRef: Dataset_Trials
          waypoint: 385,770 385,920
          stroke: "#5c8a55"
      onset: T0+20s
      duration: 40s
      flowElements:
        Simon_Start:
          type: StartEvent
        Simon_Timeline:
          type: ServiceTask
          documentation: The task's trials, one list every subject meets in the same order.
          name: Simon timeline
          dataOutputAssociations:
            Out_Simon_Timeline:
              targetRef: Simon_Trials
          additionalArguments:
            trials: 30
          implementation: simulate://simon
        Simon_Trials:
          type: DataObjectReference
          name: Simon trials
        Simon_Block:
          type: SubProcess
          documentation: >-
            One pass per trial: the trial goes to the actor along the pool's message flows, with the instruction of the
            subject's arm and the battery's prompt, and the answer comes back as the pass's output.
          name: Each trial
          properties:
            Simon_Trial:
              name: trial
            Simon_Answer:
              name: answer
          loopCharacteristics:
            type: MultiInstanceLoopCharacteristics
            isSequential: true
            loopDataInputRef: Simon_Trials
            loopDataOutputRef: Simon_Answers
            inputDataItem:
              id: Simon_Trial_Item
              name: trial
            outputDataItem:
              id: Simon_Answer_Item
              name: answer
          flowElements:
            Simon_Trial_Start:
              type: StartEvent
            Simon_Ask:
              type: Task
              name: Answer the trial
              dataInputAssociations:
                In_Simon_Trial:
                  sourceRef:
                    - Simon_Trial
                In_Simon_Instruction:
                  sourceRef:
                    - P_Instruction
                In_Simon_Prompt:
                  sourceRef:
                    - Prompt_Battery
              dataOutputAssociations:
                Out_Simon_Answer:
                  targetRef: Simon_Answer
            Simon_Trial_End:
              type: EndEvent
            Simon_TF_0: Simon_Trial_Start -> Simon_Ask
            Simon_TF_1: Simon_Ask -> Simon_Trial_End
        Simon_Answers:
          type: DataObjectReference
          name: Simon answers
        Simon_Record:
          type: ServiceTask
          documentation: >-
            Scores each answer against its trial and appends one row per trial to the trials dataset, keyed by the
            subject and its arm; its result carries the share of trials left unanswered, which the boundary event reads.
          name: Record the trials
          dataInputAssociations:
            In_Simon_Record_Trials:
              sourceRef:
                - Simon_Trials
            In_Simon_Record_Answers:
              sourceRef:
                - Simon_Answers
          dataOutputAssociations:
            Out_Simon_Record:
              targetRef: Dataset_Trials
          additionalArguments:
            subject: "{state._meta.instance.Participant_Subject}"
            arm: "{arm}"
          implementation: simulate://record
        Simon_End:
          type: EndEvent
        Simon_F_0: Simon_Start -> Simon_Timeline
        Simon_F_1: Simon_Timeline -> Simon_Block
        Simon_F_2: Simon_Block -> Simon_Record
        Simon_F_3: Simon_Record -> Simon_End
      bounds: 310 678 150 92
      font: "#5c8a55"
      fill: "#dcebd6"
      stroke: "#5c8a55"
    Failed_Interference:
      type: BoundaryEvent
      documentation: >-
        The attrition rule, as the condition a BPMN conditional boundary event watches rather than an attribute of the
        task: the task's own result carries the share of the trials it recorded no valid response for, and above one in
        five this instance leaves at Discontinued.
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_Interference:
          type: ConditionalEventDefinition
          condition: "{Simon_Record.failedTrialRate} > 0.2"
      attachedToRef: Task_Interference
      bounds: 424 752 36 36
      label: 268 789 104 22
      fill: "#f0f6ee"
      stroke: "#5c8a55"
    Task_WorkingMemory:
      type: SubProcess
      documentation: >-
        A 1-back drawn in the notation: two test blocks of 28 digits, about a third repeating the digit before, one pass
        per digit asking the actor, and the record of every trial. Each trial carries the digit before it, because the
        pool is asked one message at a time and keeps nothing between messages.
      name: Working memory (1-back)
      dataInputAssociations:
        In_Prompt_Task_WorkingMemory:
          sourceRef:
            - Prompt_Battery
          waypoint: 518,652 518,664 560,664 560,678
          stroke: "#5c8a55"
      dataOutputAssociations:
        Out_Trials_Task_WorkingMemory:
          targetRef: Dataset_Trials
          waypoint: 565,770 565,945 410,945
          stroke: "#5c8a55"
      onset: T0+60s
      duration: 3min
      flowElements:
        NBack_Start:
          type: StartEvent
        NBack_Timeline:
          type: ServiceTask
          documentation: The task's trials, one list every subject meets in the same order.
          name: 1-back timeline
          dataOutputAssociations:
            Out_NBack_Timeline:
              targetRef: NBack_Trials
          additionalArguments:
            "n": 1
            trials: 28
            blocks:
              - Test_A
              - Test_B
          implementation: simulate://nback
        NBack_Trials:
          type: DataObjectReference
          name: 1-back trials
        NBack_Block:
          type: SubProcess
          documentation: >-
            One pass per trial: the trial goes to the actor along the pool's message flows, with the instruction of the
            subject's arm and the battery's prompt, and the answer comes back as the pass's output.
          name: Each trial
          properties:
            NBack_Trial:
              name: trial
            NBack_Answer:
              name: answer
          loopCharacteristics:
            type: MultiInstanceLoopCharacteristics
            isSequential: true
            loopDataInputRef: NBack_Trials
            loopDataOutputRef: NBack_Answers
            inputDataItem:
              id: NBack_Trial_Item
              name: trial
            outputDataItem:
              id: NBack_Answer_Item
              name: answer
          flowElements:
            NBack_Trial_Start:
              type: StartEvent
            NBack_Ask:
              type: Task
              name: Answer the trial
              dataInputAssociations:
                In_NBack_Trial:
                  sourceRef:
                    - NBack_Trial
                In_NBack_Instruction:
                  sourceRef:
                    - P_Instruction
                In_NBack_Prompt:
                  sourceRef:
                    - Prompt_Battery
              dataOutputAssociations:
                Out_NBack_Answer:
                  targetRef: NBack_Answer
            NBack_Trial_End:
              type: EndEvent
            NBack_TF_0: NBack_Trial_Start -> NBack_Ask
            NBack_TF_1: NBack_Ask -> NBack_Trial_End
        NBack_Answers:
          type: DataObjectReference
          name: 1-back answers
        NBack_Record:
          type: ServiceTask
          documentation: >-
            Scores each answer against its trial and appends one row per trial to the trials dataset, keyed by the
            subject and its arm; its result carries the share of trials left unanswered, which the boundary event reads.
          name: Record the trials
          dataInputAssociations:
            In_NBack_Record_Trials:
              sourceRef:
                - NBack_Trials
            In_NBack_Record_Answers:
              sourceRef:
                - NBack_Answers
          dataOutputAssociations:
            Out_NBack_Record:
              targetRef: Dataset_Trials
          additionalArguments:
            subject: "{state._meta.instance.Participant_Subject}"
            arm: "{arm}"
          implementation: simulate://record
        NBack_End:
          type: EndEvent
        NBack_F_0: NBack_Start -> NBack_Timeline
        NBack_F_1: NBack_Timeline -> NBack_Block
        NBack_F_2: NBack_Block -> NBack_Record
        NBack_F_3: NBack_Record -> NBack_End
      bounds: 490 678 150 92
      font: "#5c8a55"
      fill: "#dcebd6"
      stroke: "#5c8a55"
    Failed_WorkingMemory:
      type: BoundaryEvent
      name: "> 20% unanswered"
      eventDefinitions:
        Cond_WorkingMemory:
          type: ConditionalEventDefinition
          condition: "{NBack_Record.failedTrialRate} > 0.2"
      attachedToRef: Task_WorkingMemory
      bounds: 604 752 36 36
      label: 646 789 104 22
      fill: "#f0f6ee"
      stroke: "#5c8a55"
    Discontinued:
      type: EndEvent
      name: "Discontinued: more than 20% of trials unanswered (n={reached})"
      bounds: 830 800 36 36
      label: 756 840 184 28
      fill: "#f1d0cd"
      stroke: "#ac5a54"
    Debrief:
      type: Task
      extensionElements:
        - type: cognitive:Instruction
          content: The session is over. Thank you for taking part; nothing further is asked of you.
      name: Debrief
      onset: T0+4min
